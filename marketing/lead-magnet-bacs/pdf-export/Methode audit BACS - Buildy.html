p\">Chapitre 6 / 11 — Supervision existante<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Notes libres par sujet<\u002Fh2>\n\n  <p>Au-delà des exigences strictes du décret, l'auditeur consigne des <strong>observations libres par sujet<\u002Fstrong>, qui complètent l'analyse réglementaire. Huit sujets sont systématiquement examinés :<\u002Fp>\n  <ul>\n    <li>L'analyse fonctionnelle existante de la supervision.<\u002Fli>\n    <li>Les usages réellement pilotés (cohérence avec l'analyse de la page précédente).<\u002Fli>\n    <li>Les équipements intégrés à la supervision.<\u002Fli>\n    <li>Les compteurs intégrés à la supervision.<\u002Fli>\n    <li>Les capacités effectives R175-3 (suivi, détection).<\u002Fli>\n    <li>La mise à disposition des données.<\u002Fli>\n    <li>Les vérifications périodiques.<\u002Fli>\n    <li>La formation de l'exploitant.<\u002Fli>\n  <\u002Ful>\n\n  <p>Pour chaque sujet, l'auditeur écrit librement ce qu'il constate, ce qui pose problème, et ce que Buildy peut éventuellement améliorer. Ces observations enrichissent le rapport au-delà de la stricte évaluation R175. Elles sont reprises dans la synthèse de l'étape 10 et alimentent le dialogue avec le propriétaire.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">31<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 6 / 11 — Supervision existante<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Ce que produit cette étape<\u002Fh2>\n  <p>À l'issue de l'étape 6, le dossier d'audit comporte :<\u002Fp>\n  <ul>\n    <li>L'identification précise de la supervision en place (ou de son absence).<\u002Fli>\n    <li>L'évaluation des cinq domaines pilotables (chauffage, climatisation, ventilation, ECS, éclairage).<\u002Fli>\n    <li>L'évaluation des exigences R175-3 §1 et §2 (suivi continu, détection de dérives).<\u002Fli>\n    <li>L'évaluation des procédures de mise à disposition des données.<\u002Fli>\n    <li>L'évaluation R175-4 (vérifications périodiques) et R175-5 (formation).<\u002Fli>\n    <li>Les notes libres par sujet, qui complètent l'analyse réglementaire.<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette analyse alimente l'étape 9 (plan d'action), où chaque non-conformité génère une action chiffrée. Elle alimente aussi la synthèse de l'étape 10, où elle est mise en perspective au regard de l'usage et des objectifs du gestionnaire.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">32<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 7                                       -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch7\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 7 / 11 — Check-list documentaire<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">07<\u002Fspan> Chapitre 7 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Check-list documentaire<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Un audit BACS ne se limite pas à ce qui se voit sur le terrain. Il s'appuie aussi sur <strong>les pièces documentaires du bâtiment<\u002Fstrong> — plans, schémas, contrats, accès.<\u002Fp>\n\n  <h2>Pourquoi cette étape ne peut pas être négligée<\u002Fh2>\n\n  <p>Sans ces pièces, deux conséquences :<\u002Fp>\n  <ul>\n    <li>Le rapport d'audit reste lacunaire (impossible de croiser les valeurs relevées avec les valeurs de référence).<\u002Fli>\n    <li>Le contrôle préfectoral éventuel se passe mal — le décret prévoit que le propriétaire doit pouvoir présenter, en plus du rapport, l'historique documentaire de son installation.<\u002Fli>\n  <\u002Ful>\n\n  <p>L'étape 7 consiste à dresser la liste des pièces requises, à vérifier leur présence effective, et — quand elles manquent — à tracer ce manque pour qu'il alimente le plan d'action. C'est une étape simple sur le papier, qui révèle souvent des trous béants dans la mémoire technique du bâtiment.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">33<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 7 / 11 — Check-list documentaire<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">La liste des dix pièces à collecter<\u002Fh2>\n\n  <p>L'auditeur procède selon une check-list standardisée, identique pour tous les bâtiments :<\u002Fp>\n  <ul>\n    <li><strong>Plans d'étages et de niveaux<\u002Fstrong> — nécessaires au découpage des zones (étape 2) et au repérage des équipements (étape 3).<\u002Fli>\n    <li><strong>Schémas électriques<\u002Fstrong> (TGBT et tableaux divisionnaires) — pour comprendre la distribution électrique et identifier les compteurs existants ou à installer.<\u002Fli>\n    <li><strong>Synoptique d'architecture de la GTB<\u002Fstrong> — pour comprendre la couverture de la supervision existante.<\u002Fli>\n    <li><strong>Plan d'adressage IP<\u002Fstrong> — pour les équipements connectés et les questions de cybersécurité.<\u002Fli>\n    <li><strong>Analyse fonctionnelle de la GTB existante<\u002Fstrong> — le document de référence qui décrit comment la supervision a été conçue à l'origine.<\u002Fli>\n    <li><strong>Coordonnées des locataires et occupants<\u002Fstrong> — pour les bâtiments multi-locataires, indispensable au cadrage des frontières opérationnelles (étape 2).<\u002Fli>\n    <li><strong>Schémas hydrauliques et fluides<\u002Fstrong> — pour comprendre la chaîne thermique (étape 5) et identifier les vannes et pompes régulées.<\u002Fli>\n    <li><strong>Carnet d'entretien et contrats de maintenance<\u002Fstrong> — pour évaluer la conformité R175-4 (étape 6).<\u002Fli>\n    <li><strong>Accès aux locaux techniques<\u002Fstrong> — badges, codes, contacts qui permettent d'intervenir physiquement.<\u002Fli>\n    <li><strong>Photos générales du site<\u002Fstrong> — façades, toiture, vues d'ensemble qui contextualisent le rapport.<\u002Fli>\n  <\u002Ful>\n\n  <p>Pour chaque pièce, l'auditeur consigne son statut : <strong>disponible<\u002Fstrong> (et alors annexée au dossier), <strong>non disponible<\u002Fstrong> (avec la raison documentée), ou <strong>à fournir<\u002Fstrong> (le propriétaire s'engage à la transmettre dans un délai défini).<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">34<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 7 / 11 — Check-list documentaire<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Que faire des pièces manquantes<\u002Fh2>\n\n  <p>L'absence d'une pièce documentaire n'est pas un blocage. C'est un constat, qui appelle une décision :<\u002Fp>\n  <ul>\n    <li><strong>Pièce reconstituable<\u002Fstrong> (plans à reproduire à partir d'un relevé, schémas à refaire à partir de l'observation terrain) → action corrective à inscrire au plan d'action de l'étape 9.<\u002Fli>\n    <li><strong>Pièce remplaçable par une autre source<\u002Fstrong> (un constat sur place qui supplée à un schéma manquant) → tracé dans les notes du dossier, sans action.<\u002Fli>\n    <li><strong>Pièce dont l'absence empêche l'audit<\u002Fstrong> (cas rare : l'analyse fonctionnelle complètement absente sur un bâtiment complexe) → l'auditeur signale au propriétaire que certaines parties de l'évaluation seront dégradées tant que la pièce n'est pas fournie.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout warn\">\n    <div class=\"callout-label\">⚠ L'analyse fonctionnelle existante<\u002Fdiv>\n    <p>C'est probablement la pièce la plus souvent manquante ou obsolète. Il n'est pas rare qu'un propriétaire récupère un bâtiment dont le dossier technique a été perdu lors d'un changement d'exploitant. La méthode Buildy reconstitue alors une analyse fonctionnelle de l'existant — c'est une prestation distincte de l'audit BACS, mais souvent indispensable pour pouvoir l'achever.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">35<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 7 / 11 — Check-list documentaire<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Ce que produit cette étape<\u002Fh2>\n  <p>À l'issue de l'étape 7, le dossier d'audit comporte :<\u002Fp>\n  <ul>\n    <li>La check-list des dix pièces, avec pour chacune son statut et sa source.<\u002Fli>\n    <li>Les pièces effectivement disponibles, annexées ou référencées.<\u002Fli>\n    <li>Les manques documentés, avec qualification (reconstituable, remplaçable, bloquant).<\u002Fli>\n    <li>Une vue d'ensemble de la maturité documentaire du bâtiment.<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette vue alimente la synthèse finale (étape 10) et fournit au propriétaire une feuille de route claire pour combler les manques documentaires — souvent indépendamment du plan de mise en conformité technique.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">36<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 8                                       -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch8\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 8 / 11 — Inspections R175-5-1 et accès techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">08<\u002Fspan> Chapitre 8 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Inspections périodiques R175-5-1 et accès techniques<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Le décret BACS impose deux démarches distinctes au propriétaire — qu'il ne faut pas confondre.<\u002Fp>\n\n  <h2>Audit Buildy n'est pas inspection R175-5-1<\u002Fh2>\n\n  <ul>\n    <li><strong>L'audit fonctionnel de la gestion technique du bâtiment<\u002Fstrong>, qui peut être interne ou externalisé. C'est la prestation que Buildy réalise.<\u002Fli>\n    <li><strong>L'inspection périodique R175-5-1<\u002Fstrong>, qui doit être réalisée par un <strong>organisme tiers indépendant<\u002Fstrong> — ni le propriétaire, ni l'exploitant, ni l'intégrateur GTB. Cette inspection est obligatoire à intervalles réguliers, son rapport doit être conservé pendant dix ans, et il peut être exigé en cas de contrôle.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout warn\">\n    <div class=\"callout-label\">⚠ Deux démarches qui ne se substituent pas<\u002Fdiv>\n    <p>Un audit Buildy aide à préparer une inspection R175-5-1 (en garantissant que le bâtiment est en état d'être inspecté), mais il ne la remplace pas. À l'inverse, une inspection R175-5-1 ne dispense pas d'un audit fonctionnel approfondi — elle vérifie la conformité, elle ne construit pas le plan d'action.<\u002Fp>\n  <\u002Fdiv>\n\n  <p>L'étape 8 sert donc à <strong>tracer les inspections officielles déjà réalisées<\u002Fstrong> par des tiers, pour les intégrer au dossier sans les confondre avec l'audit Buildy.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">37<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 8 / 11 — Inspections R175-5-1 et accès techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Tracer les inspections officielles existantes<\u002Fh2>\n\n  <p>Pour chaque inspection R175-5-1 déjà réalisée sur le bâtiment, le dossier consigne :<\u002Fp>\n  <ul>\n    <li><strong>La date<\u002Fstrong> de l'inspection.<\u002Fli>\n    <li><strong>L'organisme<\u002Fstrong> ayant réalisé l'inspection (raison sociale, numéro d'agrément éventuel).<\u002Fli>\n    <li><strong>Les anomalies constatées<\u002Fstrong> par l'inspecteur.<\u002Fli>\n    <li><strong>Les recommandations<\u002Fstrong> émises.<\u002Fli>\n    <li><strong>La date de la prochaine inspection due<\u002Fstrong> selon la périodicité réglementaire applicable au bâtiment.<\u002Fli>\n    <li><strong>La référence du rapport<\u002Fstrong> (numéro, archivage), avec la date jusqu'à laquelle il doit être conservé (dix ans après émission).<\u002Fli>\n  <\u002Ful>\n\n  <p>Si aucune inspection R175-5-1 n'a encore été réalisée sur le bâtiment, le dossier le consigne explicitement et précise la date à laquelle la première inspection est due. C'est une information critique pour le propriétaire : un bâtiment assujetti depuis trois ans sans inspection officielle est en situation irrégulière, indépendamment de la qualité technique de son installation.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">38<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 8 / 11 — Inspections R175-5-1 et accès techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Les accès techniques nécessaires à l'exploitation<\u002Fh2>\n\n  <p>Au-delà des inspections, le dossier trace également les <strong>accès techniques<\u002Fstrong> indispensables à l'exploitation continue du bâtiment :<\u002Fp>\n\n  <ul>\n    <li><strong>Identifiants de la supervision<\u002Fstrong> — qui détient les comptes administrateurs, où sont conservés les mots de passe, comment ils sont renouvelés.<\u002Fli>\n    <li><strong>Accès distants<\u002Fstrong> — VPN, plateformes web de pilotage, accès mobiles, et leurs dépendances (certificats, clés API).<\u002Fli>\n    <li><strong>Contacts opérationnels<\u002Fstrong> — exploitant en titre, mainteneur des équipements terrain, intégrateur de la supervision, support du fournisseur. Un bâtiment dont le mainteneur a quitté l'entreprise il y a deux ans, et dont personne ne sait à qui s'adresser pour un dépannage, est un risque opérationnel majeur — souvent invisible jusqu'à la première panne.<\u002Fli>\n  <\u002Ful>\n\n  <p>L'auditeur ne consigne pas les mots de passe en clair dans le rapport (question de cybersécurité). Il consigne <strong>qui détient quoi<\u002Fstrong>, et signale les lacunes (compte unique partagé entre cinq personnes, mot de passe inchangé depuis le déploiement initial, certificat expiré, etc.).<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">39<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 8 / 11 — Inspections R175-5-1 et accès techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Ce que produit cette étape<\u002Fh2>\n\n  <p>À l'issue de l'étape 8, le dossier d'audit comporte :<\u002Fp>\n  <ul>\n    <li>L'historique des inspections R175-5-1 déjà réalisées, avec leurs constats et recommandations.<\u002Fli>\n    <li>L'identification claire de la prochaine inspection due et de l'organisme à contacter.<\u002Fli>\n    <li>La cartographie des accès techniques au bâtiment (sans exposer les credentials eux-mêmes).<\u002Fli>\n    <li>Les contacts opérationnels indispensables à l'exploitation continue.<\u002Fli>\n    <li>L'identification des lacunes éventuelles (absence d'inspection, contacts orphelins, accès partagés).<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette traçabilité protège le propriétaire en cas de contrôle préfectoral, et lui donne la visibilité nécessaire pour piloter la maintenance dans la durée.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">40<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 9                                       -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch9\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 9 / 11 — Plan d'action<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">09<\u002Fspan> Chapitre 9 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Le plan d'action de mise en conformité<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Les huit étapes précédentes ont produit, sans hiérarchisation, <strong>la liste exhaustive des écarts<\u002Fstrong> entre la situation observée et les exigences du décret R175. À l'étape 9, l'auditeur transforme cette liste en <strong>plan d'action chiffrable et opposable<\u002Fstrong>.<\u002Fp>\n\n  <div class=\"pill-row\">\n    <span class=\"pill pill-alarm\"><i class=\"fas fa-circle-exclamation\"><\u002Fi> Bloquante<\u002Fspan>\n    <span class=\"pill pill-warn-soft\"><i class=\"fas fa-triangle-exclamation\"><\u002Fi> Majeure<\u002Fspan>\n    <span class=\"pill pill-mint\"><i class=\"fas fa-circle-check\"><\u002Fi> Mineure<\u002Fspan>\n  <\u002Fdiv>\n\n  <h2>De l'inventaire au plan d'action<\u002Fh2>\n\n  <p>Le passage est important. Sans hiérarchisation, le propriétaire reçoit une masse d'informations dans laquelle il ne peut pas prioriser. Avec un plan d'action structuré, il dispose d'une feuille de route lisible, qu'il peut remettre tel quel à un intégrateur GTB pour chiffrage, ou utiliser pour arbitrer en interne quelles actions traiter en premier.<\u002Fp>\n\n  <p>La méthode Buildy applique des règles de hiérarchisation <strong>identiques pour tous les bâtiments<\u002Fstrong>. Cette uniformité est essentielle : elle permet à un propriétaire qui possède plusieurs sites de comparer les rapports entre eux et d'organiser un budget pluriannuel cohérent.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">41<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 9 / 11 — Plan d'action<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Trois niveaux de sévérité<\u002Fh2>\n\n  <p>Chaque action corrective est classée selon trois sévérités, qui correspondent à trois niveaux de risque pour le propriétaire.<\u002Fp>\n\n  <h3>Bloquante<\u002Fh3>\n  <p>L'action concerne une exigence du décret qui n'est <strong>structurellement pas tenue<\u002Fstrong>. Sans cette correction, le bâtiment ne peut pas être déclaré conforme, même partiellement. Exemples typiques :<\u002Fp>\n  <ul>\n    <li>Un compteur réglementairement requis est physiquement absent.<\u002Fli>\n    <li>La supervision n'assure aucun suivi continu des consommations (R175-3 §1).<\u002Fli>\n    <li>Aucune supervision n'est en place sur un bâtiment soumis à l'obligation.<\u002Fli>\n  <\u002Ful>\n  <p>Les actions bloquantes doivent être traitées en priorité. Le rapport recommande de les engager avant l'échéance applicable au bâtiment (1ᵉʳ janvier 2025 ou 2027 selon la puissance).<\u002Fp>\n\n  <h3>Majeure<\u002Fh3>\n  <p>L'action concerne une exigence <strong>partiellement tenue<\u002Fstrong>, ou tenue <strong>sur le papier mais pas sur le terrain<\u002Fstrong>. La conformité n'est pas atteinte, mais l'écart est réparable sans refonte profonde. Exemples typiques :<\u002Fp>\n  <ul>\n    <li>Un compteur est présent mais non communicant.<\u002Fli>\n    <li>Un équipement est intégré à la supervision sur le papier, mais sa liaison est cassée.<\u002Fli>\n    <li>L'exploitant n'a pas été formé.<\u002Fli>\n    <li>Les procédures de maintenance R175-4 ne sont pas formalisées.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Mineure<\u002Fh3>\n  <p>L'action concerne une amélioration <strong>utile mais non critique<\u002Fstrong> au regard du décret. Le bâtiment peut être déclaré conforme sans la traiter, mais le rapport la signale parce qu'elle apporte une valeur opérationnelle réelle (économie d'énergie, fiabilité accrue, simplification de l'exploitation).<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">42<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 9 / 11 — Plan d'action<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Pour chaque action, ce que le rapport contient<\u002Fh2>\n\n  <p>Chaque action du plan est détaillée selon une trame fixe, identique pour toutes :<\u002Fp>\n  <ul>\n    <li><strong>Un identifiant stable<\u002Fstrong> (BACS-001, BACS-002, etc.) qui permet de la référencer sans ambiguïté dans les échanges avec les intégrateurs.<\u002Fli>\n    <li><strong>Un titre court<\u002Fstrong> qui dit ce qu'il faut faire, sans technicité inutile.<\u002Fli>\n    <li><strong>Une description<\u002Fstrong> qui contextualise — d'où vient le constat, sur quelle zone ou quel équipement, quelle observation l'a révélé.<\u002Fli>\n    <li><strong>L'article R175 concerné<\u002Fstrong>, cité explicitement. Cela donne à chaque action sa base légale et permet au propriétaire de répondre à un contrôle.<\u002Fli>\n    <li><strong>La sévérité<\u002Fstrong> (bloquante, majeure, mineure).<\u002Fli>\n    <li><strong>La zone et l'équipement source<\u002Fstrong>, pour que l'intégrateur sache où intervenir.<\u002Fli>\n    <li><strong>Une estimation d'effort<\u002Fstrong> (faible, moyen, élevé) que l'auditeur Buildy renseigne en fonction de l'expérience accumulée. Cette estimation <strong>n'est pas un chiffrage<\u002Fstrong> — c'est une indication de magnitude pour aider à la priorisation budgétaire.<\u002Fli>\n    <li><strong>Des solutions alternatives<\u002Fstrong>, quand l'action peut être traitée de plusieurs manières (raccorder un compteur existant <em>vs<\u002Fem> le remplacer ; étendre la supervision en place <em>vs<\u002Fem> la remplacer entièrement). Le propriétaire conserve ainsi sa marge d'arbitrage.<\u002Fli>\n    <li><strong>Un statut de traitement<\u002Fstrong> (ouverte, devisée, en cours, terminée, écartée) qui permet de suivre l'avancement dans le temps, audit après audit.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">43<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 9 / 11 — Plan d'action<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Comment se construit le plan, écart par écart<\u002Fh2>\n\n  <p>L'auditeur ne « décide » pas arbitrairement de la sévérité. Elle découle de la nature de l'écart constaté, selon une grille systématique :<\u002Fp>\n\n  <table>\n    <thead>\n      <tr>\n        <th>Origine de l'écart<\u002Fth>\n        <th>Action générée<\u002Fth>\n        <th>Sévérité<\u002Fth>\n        <th>Article<\u002Fth>\n      <\u002Ftr>\n    <\u002Fthead>\n    <tbody>\n      <tr><td>Équipement isolé du système d'information<\u002Ftd><td>Rendre l'équipement communicant<\u002Ftd><td class=\"sev maj\">Majeure<\u002Ftd><td>R175-3 §3<\u002Ftd><\u002Ftr>\n      <tr><td>Équipement sans arrêt manuel<\u002Ftd><td>Permettre l'arrêt manuel<\u002Ftd><td class=\"sev maj\">Majeure<\u002Ftd><td>R175-3 §4<\u002Ftd><\u002Ftr>\n      <tr><td>Équipement sans fonctionnement autonome<\u002Ftd><td>Activer le mode autonome<\u002Ftd><td class=\"sev maj\">Majeure<\u002Ftd><td>R175-3 §4<\u002Ftd><\u002Ftr>\n      <tr><td>Liaison de supervision rompue<\u002Ftd><td>Rétablir la liaison<\u002Ftd><td class=\"sev maj\">Majeure<\u002Ftd><td>R175-3<\u002Ftd><\u002Ftr>\n      <tr><td>Compteur requis absent<\u002Ftd><td>Installer le compteur<\u002Ftd><td class=\"sev bloq\">Bloquante<\u002Ftd><td>R175-3 §1<\u002Ftd><\u002Ftr>\n      <tr><td>Compteur présent non communicant<\u002Ftd><td>Raccorder le compteur<\u002Ftd><td class=\"sev maj\">Majeure<\u002Ftd><td>R175-3 §1<\u002Ftd><\u002Ftr>\n      <tr><td>Aucune supervision en place<\u002Ftd><td>Déployer une supervision<\u002Ftd><td class=\"sev bloq\">Bloquante<\u002Ftd><td>R175-3<\u002Ftd><\u002Ftr>\n      <tr><td>Supervision sans détection de dérives<\u002Ftd><td>Configurer les alertes<\u002Ftd><td class=\"sev maj\">Majeure<\u002Ftd><td>R175-3 §2<\u002Ftd><\u002Ftr>\n      <tr><td>Procédures de maintenance non formalisées<\u002Ftd><td>Établir les procédures<\u002Ftd><td class=\"sev maj\">Majeure<\u002Ftd><td>R175-4<\u002Ftd><\u002Ftr>\n      <tr><td>Exploitant non formé<\u002Ftd><td>Programmer la formation<\u002Ftd><td class=\"sev min\">Mineure<\u002Ftd><td>R175-5<\u002Ftd><\u002Ftr>\n      <tr><td>Régulation thermique manquante (R175-6 applicable)<\u002Ftd><td>Selon contexte<\u002Ftd><td class=\"sev bloq\">Bloquante / Majeure<\u002Ftd><td>R175-6<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <p>Cette grille rend le plan <strong>reproductible<\u002Fstrong> d'un audit à l'autre — deux auditeurs Buildy intervenant sur le même bâtiment produisent un plan d'action identique. C'est une garantie de fiabilité pour le propriétaire.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">44<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 9 / 11 — Plan d'action<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"callout r175\">\n    <div class=\"callout-label\">Cas des équipements hors service<\u002Fdiv>\n    <p>Un équipement déclaré hors service ne génère pas d'action corrective tant qu'aucun équipement ne le remplace. Il reste tracé dans l'inventaire et dans le rapport, pour mémoire et pour la planification de remplacement.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"callout r175\">\n    <div class=\"callout-label\">Cas des exemptions<\u002Fdiv>\n    <p>Un générateur à biomasse exempté du R175-6, par exemple, ne génère aucune action. L'exemption est tracée explicitement dans le rapport pour qu'elle soit défendable face à un contrôle.<\u002Fp>\n  <\u002Fdiv>\n\n  <h2>Annotations commerciales et solutions alternatives<\u002Fh2>\n\n  <p>Le plan d'action n'est pas seulement un constat technique. Il intègre également <strong>des annotations commerciales<\u002Fstrong> que l'auditeur ajoute pour préparer le travail des intégrateurs et de l'équipe commerciale du propriétaire :<\u002Fp>\n  <ul>\n    <li><strong>Notes contextuelles<\u002Fstrong> — particularités d'accès, contraintes d'exploitation, périodes d'arrêt prévues, relation avec le mainteneur en place.<\u002Fli>\n    <li><strong>Solutions alternatives<\u002Fstrong> — quand plusieurs approches sont envisageables, l'auditeur les pose à plat. Cela évite que l'intégrateur reçoive une demande étroite et chiffre une seule solution alors qu'une autre serait moins coûteuse ou plus pérenne.<\u002Fli>\n    <li><strong>Effort estimé<\u002Fstrong> — magnitude qualitative (faible, moyen, élevé), pour aider à la priorisation budgétaire avant chiffrage précis.<\u002Fli>\n  <\u002Ful>\n\n  <p>Ces annotations distinguent un audit Buildy d'une simple liste de constats : elles rendent le plan exploitable directement, sans phase intermédiaire d'analyse.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">45<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 9 / 11 — Plan d'action<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Ce que produit cette étape<\u002Fh2>\n  <p>À l'issue de l'étape 9, le dossier d'audit comporte :<\u002Fp>\n  <ul>\n    <li>Le plan d'action complet, hiérarchisé par sévérité (bloquantes, majeures, mineures).<\u002Fli>\n    <li>Pour chaque action, sa fiche complète (identifiant, titre, description, article R175, zone, source, effort, alternatives, notes).<\u002Fli>\n    <li>La traçabilité de chaque action vers l'écart constaté qui l'a générée — un intégrateur peut remonter de l'action à l'observation terrain qui l'a justifiée.<\u002Fli>\n    <li>Une vue d'ensemble lisible par un décideur non technique, qui pourra arbitrer les priorités.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout tip\">\n    <div class=\"callout-label\">À retenir<\u002Fdiv>\n    <p>Ce plan d'action constitue <strong>la valeur métier centrale<\u002Fstrong> de l'audit. C'est sur cette base que le propriétaire engage les travaux, sollicite les intégrateurs, et arbitre son budget de mise en conformité.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">46<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 10                                      -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch10\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 10 / 11 — Synthèse et livraison<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">10<\u002Fspan> Chapitre 10 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Synthèse et livraison du rapport<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">À l'issue des neuf étapes précédentes, l'auditeur dispose de l'intégralité des éléments pour produire <strong>la synthèse de conformité<\u002Fstrong> du bâtiment au regard du décret R175.<\u002Fp>\n\n  <h2>Le tableau de bord de conformité R175<\u002Fh2>\n\n  <p>Cette synthèse prend la forme d'un tableau de bord à huit lignes, qui couvre l'ensemble des exigences réglementaires :<\u002Fp>\n\n  <ul>\n    <li><strong>Assujettissement<\u002Fstrong> (R175-2) — ligne informative qui rappelle pourquoi le bâtiment est concerné, à quelle échéance, et avec quelle puissance assujettissante.<\u002Fli>\n    <li><strong>Suivi continu<\u002Fstrong> (R175-3 §1) — verdict de conformité sur l'enregistrement à pas horaire et la conservation cinq ans.<\u002Fli>\n    <li><strong>Interopérabilité<\u002Fstrong> (R175-3 §3) — verdict consolidé sur l'ensemble des équipements examinés.<\u002Fli>\n    <li><strong>Arrêt manuel et fonctionnement autonome<\u002Fstrong> (R175-3 §4) — verdict consolidé.<\u002Fli>\n    <li><strong>Mise à disposition des données<\u002Fstrong> (dernier alinéa R175-3) — verdict sur les procédures vers le gestionnaire et les exploitants.<\u002Fli>\n    <li><strong>Vérifications périodiques<\u002Fstrong> (R175-4) — verdict sur les procédures de maintenance.<\u002Fli>\n    <li><strong>Formation de l'exploitant<\u002Fstrong> (R175-5) — verdict sur les attestations existantes.<\u002Fli>\n    <li><strong>Régulation thermique<\u002Fstrong> (R175-6) — verdict, ou mention <em>non applicable<\u002Fem> selon la date de permis et de travaux.<\u002Fli>\n  <\u002Ful>\n\n  <p>Pour chaque ligne, trois verdicts possibles : <strong>conforme<\u002Fstrong>, <strong>partiellement conforme<\u002Fstrong> ou <strong>non conforme<\u002Fstrong>, justifiés par le détail des étapes correspondantes du rapport. Cette structure rend le rapport directement opposable face à un contrôle préfectoral.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">47<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 10 / 11 — Synthèse et livraison<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Le verdict global et la note de synthèse<\u002Fh2>\n\n  <p>Au-dessus du tableau de bord, le rapport porte un <strong>verdict global<\u002Fstrong> de conformité du bâtiment, selon une logique simple et reproductible :<\u002Fp>\n  <ul>\n    <li>S'il existe au moins une action <strong>bloquante<\u002Fstrong> dans le plan, le bâtiment est déclaré <strong>non conforme<\u002Fstrong>.<\u002Fli>\n    <li>Sinon, s'il existe au moins une action <strong>majeure<\u002Fstrong>, le bâtiment est déclaré <strong>partiellement conforme<\u002Fstrong>.<\u002Fli>\n    <li>Sinon, le bâtiment est déclaré <strong>conforme<\u002Fstrong>.<\u002Fli>\n  <\u002Ful>\n\n  <p>Ce verdict figure en page de couverture du rapport et conditionne sa couleur d'identification. Un propriétaire qui présente le rapport à un contrôleur sait immédiatement où il en est.<\u002Fp>\n\n  <p>Le verdict est complété par une <strong>note de synthèse rédigée<\u002Fstrong> de quelques paragraphes, qui contextualise le résultat pour des lecteurs non techniques (asset manager, direction générale, conseil d'administration). Cette note explique en langage clair :<\u002Fp>\n  <ul>\n    <li>Pourquoi le bâtiment est dans la situation où il est.<\u002Fli>\n    <li>Quelles actions sont à engager en priorité et pour quel ordre de grandeur d'effort.<\u002Fli>\n    <li>Quels sont les risques associés à l'inaction (échéance manquée, contrôle préfectoral, dérive énergétique).<\u002Fli>\n    <li>Quelles sont les opportunités d'amélioration au-delà du strict décret.<\u002Fli>\n  <\u002Ful>\n\n  <p>La note de synthèse est l'élément qui circule en interne chez le propriétaire — souvent extrait du rapport pour être présenté à un comité. L'auditeur la rédige avec ce destinataire en tête.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">48<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 10 / 11 — Synthèse et livraison<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Les quatre annexes obligatoires du rapport<\u002Fh2>\n\n  <p>Le rapport d'audit BACS de Buildy comporte systématiquement <strong>quatre annexes<\u002Fstrong> qui le rendent opposable et complet.<\u002Fp>\n\n  <h3>Annexe A — Texte intégral du décret R175<\u002Fh3>\n  <p>Les articles R175-1 à R175-6 sont reproduits in extenso. Cela permet au lecteur du rapport de croiser chaque action corrective avec l'article exact qui la justifie, sans avoir à consulter le Journal officiel. C'est aussi une garantie face à un contrôle : le rapport contient en lui-même la base légale qu'il invoque.<\u002Fp>\n\n  <h3>Annexe B — Méthodologie Buildy<\u002Fh3>\n  <p>Les neuf hypothèses méthodologiques qui structurent l'évaluation sont explicitées : périmètre BACS retenu, seuil de puissance applicable, définition de la zone fonctionnelle, modalités d'évaluation du suivi continu, traitement de l'interopérabilité, position sur la régulation thermique, vérifications périodiques, formation, applicabilité.<\u002Fp>\n  <p>Cette annexe rend la démarche <strong>auditable<\u002Fstrong>. Un confrère qui prend le rapport en main peut comprendre comment l'auditeur a procédé, et reproduire le raisonnement sur un autre bâtiment.<\u002Fp>\n\n  <h3>Annexe C — Justification des préconisations<\u002Fh3>\n  <p>Pour chaque action du plan (BACS-001, BACS-002, etc.), un paragraphe spécifique justifie son inscription : quelle observation l'a déclenchée, à quel article du décret elle se rattache, pourquoi la sévérité retenue.<\u002Fp>\n  <p>Cette annexe peut paraître redondante avec le plan d'action principal. Elle ne l'est pas : elle isole la traçabilité juridique de la lisibilité opérationnelle. Le plan d'action principal est conçu pour être lu et exploité ; l'annexe C est conçue pour être défendue.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">49<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 10 / 11 — Synthèse et livraison<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h3 style=\"margin-top:0;\">Annexe D — Mentions légales et disclaimers<\u002Fh3>\n\n  <p>Sept clauses qui cadrent la portée du rapport :<\u002Fp>\n  <ul>\n    <li>L'audit Buildy ne se substitue pas à l'inspection officielle R175-5-1.<\u002Fli>\n    <li>L'évaluation est fonctionnelle, pas certificatoire (ISO 52120-1 n'est pas requise).<\u002Fli>\n    <li>L'audit BACS ne se confond pas avec un dossier CEE BAT-TH-116.<\u002Fli>\n    <li>Le calcul du temps de retour sur investissement reste sous la responsabilité du propriétaire.<\u002Fli>\n    <li>L'évolution réglementaire peut modifier la portée des constats à terme.<\u002Fli>\n    <li>Les recommandations sont indicatives et n'engagent pas leur exécution.<\u002Fli>\n    <li>Les informations incomplètes communiquées par le propriétaire engagent sa responsabilité.<\u002Fli>\n  <\u002Ful>\n\n  <p>Ces clauses protègent à la fois le propriétaire (en délimitant ce qu'il a acquis) et l'auditeur (en cadrant ce qu'il a livré).<\u002Fp>\n\n  <h2>La livraison et la conservation<\u002Fh2>\n\n  <p>Le rapport est livré au format PDF, conforme aux standards de présentation des dossiers techniques. Il comporte une page de couverture (verdict, identité du bâtiment, date), une page d'essentiel (synthèse pour décideur), un tableau de bord (huit lignes R175), les neuf chapitres détaillés, le plan d'action numéroté, et les quatre annexes.<\u002Fp>\n\n  <p>Le rapport doit être <strong>conservé dix ans<\u002Fstrong> par le propriétaire. Cette durée est cohérente avec celle exigée pour le rapport d'inspection officielle R175-5-1, et permet d'avoir à tout moment la mémoire complète des évaluations successives du bâtiment.<\u002Fp>\n\n  <p>En pratique, le propriétaire archive le rapport dans son dossier des ouvrages exécutés (DOE) du bâtiment, dans son système de GED, ou dans le coffre-fort numérique de son contrat de gestion. Le rapport peut être présenté lors d'un contrôle préfectoral, transmis à un acheteur en cas de cession du bâtiment, ou utilisé comme base de référence pour le prochain audit.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">50<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 10 / 11 — Synthèse et livraison<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Ce que produit cette étape<\u002Fh2>\n\n  <p>À l'issue de l'étape 10, le propriétaire dispose :<\u002Fp>\n  <ul>\n    <li>Du tableau de bord de conformité R175 en huit lignes.<\u002Fli>\n    <li>Du verdict global (conforme, partiellement conforme, non conforme).<\u002Fli>\n    <li>De la note de synthèse rédigée pour les décideurs.<\u002Fli>\n    <li>Du plan d'action numéroté et hiérarchisé.<\u002Fli>\n    <li>Des quatre annexes obligatoires (texte du décret, méthodologie, justifications, mentions légales).<\u002Fli>\n    <li>D'un rapport PDF complet, archivable, présentable en contrôle.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout tip\">\n    <div class=\"callout-label\">À retenir<\u002Fdiv>\n    <p>À ce stade, l'audit est livré. Le travail du propriétaire commence — engagement des actions correctives, dialogue avec les intégrateurs, planification de l'inspection officielle R175-5-1 si elle n'a pas encore eu lieu.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">51<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 11                                      -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch11\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 11 / 11 — Pièges à éviter<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">11<\u002Fspan> Chapitre 11 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Les pièges à éviter après l'audit<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Le rapport d'audit n'est pas une fin en soi. C'est le <strong>cahier des charges<\u002Fstrong> à partir duquel les intégrateurs GTB vont vous proposer leurs solutions, et à partir duquel vous allez engager des travaux qui se chiffrent en milliers, voire dizaines de milliers d'euros.<\u002Fp>\n\n  <p>Sur cette dernière étape — du rapport reçu à la mise en conformité effective — sept pièges reviennent systématiquement. Ils ne concernent pas la méthode d'audit, mais ce que le propriétaire ou le gestionnaire fait du rapport une fois livré. Les éviter, c'est gagner du temps, du budget, et garantir la pérennité de l'installation.<\u002Fp>\n\n  <h2>Piège n°1 — L'auditeur vous affirme qu'une classe ISO 52120 est exigée pour être conforme<\u002Fh2>\n\n  <p>Une affirmation revient régulièrement dans la bouche d'auditeurs ou d'intégrateurs&nbsp;: <em>« Pour être conforme au décret BACS, votre GTB doit être de classe C (ou B, ou A) au sens de la norme NF EN ISO 52120-1. »<\u002Fem> C'est faux. Le décret R175 et son arrêté d'application du 7 avril 2023 <strong>ne citent pas la norme ISO 52120-1<\u002Fstrong> et n'imposent aucune classe de performance. Le législateur a retenu une approche fondée sur les <strong>résultats attendus<\u002Fstrong>, pas sur une certification.<\u002Fp>\n\n  <p>Ce qui est réellement exigible se trouve uniquement à l'article R175-3&nbsp;: suivi continu et conservation des consommations, détection des dérives, interopérabilité, possibilité d'arrêt manuel et de fonctionnement autonome. Une GTB qui délivre ces quatre exigences est conforme — indépendamment de la classe ISO qu'on voudrait lui attribuer.<\u002Fp>\n\n  <div class=\"callout r175\">\n    <div class=\"callout-label\">D'où vient la confusion<\u002Fdiv>\n    <p>Deux sources alimentent l'amalgame. D'une part, la <strong>fiche CEE BAT-TH-116<\u002Fstrong> (prime aux économies d'énergie) exige une GTB de classe A ou B selon ISO 52120-1. Mais c'est une condition d'éligibilité à la prime, pas à la conformité au décret. D'autre part, la <strong>FAQ gouvernementale<\u002Fstrong> (rt-re-batiment.developpement-durable.gouv.fr) interprète qu'une classe C serait insuffisante. Une FAQ administrative n'a pas valeur de texte réglementaire&nbsp;: elle ne peut pas créer d'obligation au-delà du décret. En cas de contradiction, le texte du décret prime.<\u002Fp>\n  <\u002Fdiv>\n\n  <p>Pourquoi ce piège coûte cher&nbsp;: justifier une « mise à niveau vers la classe B » peut transformer une mise en conformité raisonnable en chantier surdimensionné, sur la base d'une exigence qui n'est pas opposable. Si l'auditeur invoque une classe ISO comme obligation légale, demandez-lui l'article précis du Code de la construction et de l'habitation qui la mentionne. Il n'existe pas.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">52<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 11 / 11 — Pièges à éviter<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n\n  <h2 style=\"margin-top:0;\">Piège n°2 — Accepter un audit BACS qui ne suit pas la méthode décrite ici<\u002Fh2>\n\n  <p>La plupart des rapports d'audit BACS que nous avons examinés ne respectent pas la méthode décrite dans ce livre blanc. Le décret R175 y est survolé, parfois cité de mémoire, parfois — c'est plus fréquent qu'on ne le pense — manifestement jamais lu en intégralité par l'auditeur. Les zones fonctionnelles ne sont pas définies, les équipements ne sont pas qualifiés individuellement, le plan d'action est une liste générique sans identifiants stables ni références aux articles du décret. C'est grave, parce que ce sont précisément les rapports qui ne tiennent pas devant un contrôle préfectoral, et qui ne sont pas exploitables par les intégrateurs en aval.<\u002Fp>\n\n  <p>Ce type d'audit est souvent <strong>gratuit ou très peu cher<\u002Fstrong>. C'est rarement un hasard. Un audit BACS qui respecte la méthode décrite dans ce document mobilise plusieurs jours d'auditeur expérimenté, deux visites sur site, un travail documentaire substantiel et la production d'un rapport directement opposable. Cela a un coût. Un audit livré pour quelques centaines d'euros, ou offert dans le cadre d'un devis d'intégration, n'a pas pu être produit selon ces standards — et l'expérience montre qu'il ne l'est pas.<\u002Fp>\n\n  <p>Quelques signaux à vérifier avant de retenir un auditeur :<\u002Fp>\n  <ul>\n    <li>Le rapport contient-il le <strong>texte intégral des articles R175<\u002Fstrong> applicables, ou seulement une mention générique du décret&nbsp;?<\u002Fli>\n    <li>Le bâtiment est-il découpé en <strong>zones fonctionnelles<\u002Fstrong> identifiées, ou traité comme un tout indifférencié&nbsp;?<\u002Fli>\n    <li>Chaque équipement est-il <strong>inventorié individuellement<\u002Fstrong> avec sa puissance, son protocole, et son verdict de conformité&nbsp;?<\u002Fli>\n    <li>Les actions correctives portent-elles un <strong>identifiant stable<\u002Fstrong>, une sévérité, et un article R175 source&nbsp;?<\u002Fli>\n    <li>L'auditeur est-il capable d'expliquer la <strong>différence entre R175-3 §3 et R175-3 §4<\u002Fstrong> sans hésiter&nbsp;?<\u002Fli>\n  <\u002Ful>\n\n  <p>Si la réponse est non à plus d'une de ces questions, le rapport produit ne sera pas exploitable. <em>Vous en aurez pour votre argent.<\u002Fem><\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">53<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 11 / 11 — Pièges à éviter<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n\n  <h2 style=\"margin-top:0;\">Piège n°3 — Confier l'audit à un acteur qui n'aura pas à assumer ses préconisations<\u002Fh2>\n\n  <p>Un bureau d'études techniques généraliste et un intégrateur GTB spécialisé peuvent l'un comme l'autre produire un audit BACS conforme à la méthode décrite dans ce livre blanc. Le critère discriminant n'est pas le statut de l'auditeur, mais sa <strong>responsabilité dans la chaîne<\u002Fstrong>&nbsp;: signe-t-il ses préconisations en sachant qu'il devra, lui ou ses confrères directs, les mettre en œuvre&nbsp;?<\u002Fp>\n\n  <p>Un BET généraliste qui réalise l'audit mais ne fait pas les travaux ensuite n'a pas d'incitation forte à vérifier que ses préconisations sont <strong>réalisables sur ce bâtiment précis<\u002Fstrong>, dans ce budget, dans les délais où le décret s'applique. Le rapport peut être techniquement irréprochable et opérationnellement inutilisable — actions chiffrées au jugé, équipements préconisés sans vérification de compatibilité avec l'existant, calendrier de mise en œuvre déconnecté de la réalité d'exploitation.<\u002Fp>\n\n  <p>À l'inverse, un intégrateur GTB qui réalise lui-même l'audit, sachant qu'il aura à porter ou à transmettre les travaux à un confrère, écrit chaque ligne du plan d'action en sachant qu'il pourra avoir à la défendre devant un chiffrage. Cette tension produit un audit plus dur sur les critères techniques (parce qu'il ne veut pas se faire piéger plus tard), et surtout plus juste sur la faisabilité (parce qu'il connaît le coût réel des préconisations).<\u002Fp>\n\n  <div class=\"callout\">\n    <div class=\"callout-label\">Le critère à exiger, quelle que soit la nature de l'auditeur<\u002Fdiv>\n    <p>Qu'il <strong>s'engage à assumer la responsabilité de ce qu'il écrit dans le rapport<\u002Fstrong>, et qu'il soit techniquement capable — ou en lien direct avec un intégrateur — de chiffrer chaque action préconisée si on lui demande de le faire. Un auditeur qui se réfugie derrière la formule «&nbsp;à chiffrer par l'entreprise retenue&nbsp;» pour la totalité des actions n'a pas fait son travail.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">54<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 11 / 11 — Pièges à éviter<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n\n  <h2 style=\"margin-top:0;\">Piège n°4 — Laisser l'auditeur calculer le TRI d'exemption à votre place<\u002Fh2>\n\n  <p>Le décret R175 prévoit explicitement une <strong>exemption fondée sur le temps de retour sur investissement<\u002Fstrong>. Deux articles l'évoquent dans des termes similaires.<\u002Fp>\n\n  <div class=\"callout r175\">\n    <div class=\"callout-label\">R175-2, dernier alinéa<\u002Fdiv>\n    <p><em>« Sauf si le propriétaire produit une étude établissant que l'installation d'un système d'automatisation et de contrôle n'est pas réalisable avec un temps de retour sur investissement inférieur à dix ans. »<\u002Fem><\u002Fp>\n    <div class=\"callout-label\" style=\"margin-top:10px;\">R175-6, II 2°<\u002Fdiv>\n    <p><em>« …sauf si les propriétaires produisent une étude établissant que l'installation d'un système automatique de régulation… n'est pas réalisable avec un temps de retour sur investissement inférieur à dix ans. »<\u002Fem><\u002Fp>\n  <\u002Fdiv>\n\n  <p><strong>Notez le sujet de la phrase<\u002Fstrong>&nbsp;: c'est le propriétaire qui produit l'étude. Pas l'auditeur, pas l'intégrateur. En cas de contrôle préfectoral, c'est lui qui devra défendre les hypothèses retenues. Si elles ne tiennent pas, l'exemption tombe et le bâtiment est requalifié comme non conforme.<\u002Fp>\n\n  <p>Le piège&nbsp;: laisser l'auditeur intégrer dans son rapport un calcul de TRI fondé sur <strong>ses propres hypothèses<\u002Fstrong> — coût d'investissement estimé au doigt, économies projetées orientées selon son intérêt, tarif énergie figé à un instant donné, durée d'amortissement arbitraire. Un calcul utile pour l'auditeur, peu défendable pour le propriétaire.<\u002Fp>\n\n  <p><strong>La bonne pratique<\u002Fstrong>&nbsp;: le propriétaire produit son propre calcul de TRI, après obtention du rapport d'audit complet et après consultation de plusieurs intégrateurs GTB pour disposer de coûts d'investissement réels. Le calcul suit les <strong>recommandations officielles du ministère<\u002Fstrong> (<a href=\"https://rt-re-batiment.developpement-durable.gouv.fr/faq-bacs-20-comment-le-tri-se-calcule-t-il-a953.html\">rt-re-batiment.developpement-durable.gouv.fr — FAQ BACS-20<\u002Fa>) — méthode, hypothèses de prix de l'énergie, périmètre des économies à prendre en compte. Cette démarche protège le propriétaire en cas de contrôle&nbsp;: il défend une étude qu'il a commandée et signée, avec des hypothèses qu'il peut justifier ligne à ligne.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">55<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 11 / 11 — Pièges à éviter<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n\n  <h2 style=\"margin-top:0;\">Piège n°5 — Confondre fourniture de matériel et solution clé en main<\u002Fh2>\n\n  <p>Un intégrateur GTB peut chiffrer ses prestations à plusieurs niveaux d'engagement. Du moins-disant au plus complet :<\u002Fp>\n  <ul>\n    <li><strong>Fourniture seule<\u002Fstrong> — il livre les capteurs, les automates, la passerelle, et c'est tout.<\u002Fli>\n    <li><strong>Fourniture et paramétrage<\u002Fstrong> — il livre et configure les équipements, mais ne touche pas à ce qu'il y a autour.<\u002Fli>\n    <li><strong>Solution clé en main<\u002Fstrong> — il livre, paramètre, <strong>et prend en charge tout ce qui est nécessaire à la mise en service réelle<\u002Fstrong> : installation électrique (tirage de câbles, raccordements, modifications de tableaux), plomberie (vannes motorisées, sondes immergées, perçages), génie civil (saignées, percements, rebouchages), reprise de la documentation existante.<\u002Fli>\n  <\u002Ful>\n\n  <p>Beaucoup de devis sont chiffrés au premier ou au deuxième niveau, <strong>sans le dire explicitement<\u002Fstrong>. Le propriétaire pense recevoir une solution complète ; il découvre, après signature, que l'électricien doit intervenir pour câbler les capteurs, que le plombier doit poser les sondes immergées, que les percements ne sont pas inclus. Le budget final dérape de 30 à 50&nbsp;%.<\u002Fp>\n\n  <div class=\"callout warn\">\n    <div class=\"callout-label\">À exiger dans la consultation<\u002Fdiv>\n    <p>La mention explicite du niveau d'engagement, et la liste des prestations annexes (électricité, plomberie, génie civil, reprise documentaire) avec leur prise en charge — <em>inclus<\u002Fem>, <em>à charge du propriétaire<\u002Fem>, ou <em>à chiffrer séparément<\u002Fem>. Un intégrateur sérieux acceptera de répondre. Un intégrateur qui esquive la question est un signal.<\u002Fp>\n  <\u002Fdiv>\n\n  <h2>Piège n°6 — Sous-estimer l'expérience d'utilisation de la supervision<\u002Fh2>\n\n  <p>L'intégrateur livre rarement la supervision logicielle elle-même. Il intègre une solution existante — la sienne, celle d'un éditeur partenaire, ou une solution sélectionnée par le propriétaire. Cette solution logicielle est ce que l'exploitant utilisera <strong>au quotidien pendant les dix prochaines années<\u002Fstrong>.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">56<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 11 / 11 — Pièges à éviter<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n\n  <p>Trois questions à poser systématiquement avant de retenir une solution de supervision GTB :<\u002Fp>\n  <ul>\n    <li><strong>Est-elle utilisable par un exploitant non spécialiste&nbsp;?<\u002Fstrong> Demandez une démonstration sur un cas réel, pas une vidéo commerciale. Demandez à l'exploitant pressenti de manipuler la solution lui-même. Si la prise en main demande une formation lourde, la conformité R175-5 (formation de l'exploitant) sera plus coûteuse, et l'usage réel se dégradera dans le temps.<\u002Fli>\n    <li><strong>Est-elle accessible à distance et en mobilité&nbsp;?<\u002Fstrong> Une supervision uniquement accessible depuis un poste fixe en local technique est, en pratique, sous-utilisée. Vérifiez la disponibilité d'un accès web sécurisé et d'une application mobile pour les déplacements terrain.<\u002Fli>\n    <li><strong>Est-elle ouverte&nbsp;?<\u002Fstrong> Vérifiez que les données peuvent être exportées (au minimum en CSV, idéalement via une API). Une supervision propriétaire qui retient vos données vous lie à son éditeur pour toute la durée de vie de l'installation.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout\">\n    <div class=\"callout-label\">Critère parfois oublié<\u002Fdiv>\n    <p>La pérennité de l'éditeur. Une solution logicielle excellente mais éditée par une petite structure rachetée ou liquidée trois ans après l'installation est un risque opérationnel. Privilégier les éditeurs établis, ou ceux qui s'appuient sur des standards ouverts.<\u002Fp>\n  <\u002Fdiv>\n\n  <h2>Piège n°7 — Supervision isolée plutôt qu'intégrée à une hypervision<\u002Fh2>\n\n  <p>La supervision GTB d'un bâtiment est utile pour ce bâtiment. <strong>L'hypervision<\u002Fstrong> est la couche au-dessus, qui consolide les données de tous les bâtiments d'un parc immobilier dans une vue unique : tableaux de bord agrégés, comparaisons inter-sites, alertes consolidées, reporting réglementaire centralisé.<\u002Fp>\n\n  <p>Pour un asset manager ou un property manager qui gère plus d'un site, <strong>disposer d'une hypervision change la nature de l'exploitation<\u002Fstrong> : on ne pilote plus bâtiment par bâtiment, on pilote un parc.<\u002Fp>\n\n  <p>Avant de retenir une supervision GTB pour un bâtiment, posez la question de l'hypervision :<\u002Fp>\n  <ul>\n    <li>La supervision proposée par l'intégrateur est-elle <strong>compatible<\u002Fstrong> avec une hypervision tierce&nbsp;?<\u002Fli>\n    <li>Quels protocoles d'échange supporte-t-elle pour exposer ses données à une couche supérieure&nbsp;?<\u002Fli>\n    <li>Si vous gérez un parc immobilier, le choix d'une supervision incompatible avec votre hypervision crée des silos qui seront coûteux à briser plus tard.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout tip\">\n    <div class=\"callout-label\">Le bon réflexe pour un parc immobilier<\u002Fdiv>\n    <p>Choisir d'abord l'hypervision qui consolidera votre parc dans la durée, puis sélectionner pour chaque bâtiment des supervisions GTB compatibles avec elle. L'ordre inverse — supervisions par bâtiment d'abord, hypervision après — multiplie par trois ou quatre le coût d'intégration final.<\u002Fp>\n    <p>Buildy propose <strong>Hyperveez<\u002Fstrong> comme couche d'hypervision pour les parcs immobiliers multi-sites — d'autres éditeurs occupent ce marché, le critère essentiel est la compatibilité avec les supervisions de chaque bâtiment.<\u002Fp>\n  <\u002Fdiv>\n\n  <h2>Ce que ce chapitre vous apporte<\u002Fh2>\n  <ul>\n    <li>Pourquoi exiger qu'une classe ISO 52120 soit atteinte n'est pas une obligation réglementaire, et comment repérer cette confusion lorsqu'elle vous est présentée comme telle.<\u002Fli>\n    <li>Quels signaux concrets permettent de juger, avant de retenir un auditeur, si son rapport suivra la méthode décrite dans ce livre blanc ou s'il se contentera de survoler le décret.<\u002Fli>\n    <li>Pourquoi le statut de l'auditeur (BET généraliste ou intégrateur GTB) compte moins que sa capacité à assumer la responsabilité de ses préconisations et leur faisabilité réelle.<\u002Fli>\n    <li>Pourquoi le calcul du TRI d'exemption (R175-2 et R175-6) doit être produit par le propriétaire lui-même, selon la méthode officielle du ministère, et non délégué à l'auditeur.<\u002Fli>\n    <li>Comment distinguer une fourniture de matériel d'une solution clé en main, et quelles prestations annexes doivent être explicitement chiffrées dans le devis d'intégration.<\u002Fli>\n    <li>Quels critères appliquer à la solution logicielle de supervision : simplicité d'usage, accès distant, ouverture des données, pérennité de l'éditeur.<\u002Fli>\n    <li>Pourquoi penser hypervision dès le départ quand vous gérez plus d'un bâtiment, et pourquoi l'ordre inverse coûte trois à quatre fois plus cher.<\u002Fli>\n  <\u002Ful>\n\n  <p><em>Un audit rigoureux peut être ruiné par sept erreurs en aval. Les connaître, c'est s'épargner les surcoûts qu'elles entraînent — surdimensionnement injustifié, rapport non opposable, préconisations irréalisables, TRI d'exemption indéfendable, intégration incomplète, supervision impraticable, isolement par rapport au parc immobilier.<\u002Fem><\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">57<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CONCLUSION                                       -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"conclusion\">\n  <div class=\"page-header\"><span class=\"head-chap\">Conclusion<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">FIN<\u002Fspan> Conclusion<\u002Fdiv>\n  <h1 class=\"chapter-title\">Récapitulatif de ce que vous venez de parcourir<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Vous tenez maintenant la méthode complète. Pour mesurer ce qu'elle représente, voici, sans commentaire, l'inventaire de ce qui a été parcouru chapitre par chapitre.<\u002Fp>\n\n  <ul>\n    <li><strong>10 étapes<\u002Fstrong> de validation à mener dans l'ordre.<\u002Fli>\n    <li><strong>6 catégories<\u002Fstrong> de systèmes techniques à inventorier par zone.<\u002Fli>\n    <li>Une matrice de comptage à compléter sur <strong>6 usages<\u002Fstrong> réglementaires multipliés par autant de zones que le bâtiment en compte.<\u002Fli>\n    <li>Pour chaque équipement, plusieurs dimensions à qualifier : identification, caractéristiques techniques, connectivité, conformité au décret. Sur un siège social de 30 000 m², ce travail concerne <strong>plus d'une centaine d'équipements<\u002Fstrong>.<\u002Fli>\n    <li>Une analyse de régulation thermique sur <strong>3 niveaux<\u002Fstrong> (production, distribution, émission), zone par zone, quand le R175-6 s'applique.<\u002Fli>\n    <li><strong>8 sujets<\u002Fstrong> à examiner sur la supervision existante, du suivi continu à la formation de l'exploitant.<\u002Fli>\n    <li><strong>10 pièces documentaires<\u002Fstrong> à collecter et à classer.<\u002Fli>\n    <li>Une <strong>logique de hiérarchisation<\u002Fstrong> des actions correctives à appliquer (3 sévérités, 5 statuts de traitement, traçabilité jusqu'à l'observation source).<\u002Fli>\n    <li><strong>8 lignes<\u002Fstrong> au tableau de bord R175 final.<\u002Fli>\n    <li><strong>4 annexes obligatoires<\u002Fstrong> dans le rapport livré.<\u002Fli>\n    <li><strong>10 ans<\u002Fstrong> de conservation légale du rapport.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"quote-pull\">\n    <p><em>Si vous gérez un seul bâtiment et que vous avez le temps : faites-le. Vous avez maintenant la méthode.<\u002Fem><\u002Fp>\n    <p><em>Si vous gérez plusieurs bâtiments ou que vous voulez aller vite : appelez-nous.<\u002Fem><\u002Fp>\n    <p>Les deux choix sont légitimes. C'est pour cela que ce livre blanc existe.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">57<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- PIVOT — Tarif                                    -->\n<!-- =============================================== -->\n<section class=\"pivot\">\n  <div class=\"pivot-eyebrow\">Vous préférez nous laisser faire ?<\u002Fdiv>\n\n  <h2>Buildy réalise vos audits BACS.<\u002Fh2>\n\n  <p>Notre méthode s'applique à tous types de bâtiments tertiaires assujettis au décret R175 — commerces de centre-ville, plateaux de bureaux, sièges sociaux, cellules logistiques, établissements d'enseignement et de formation.<\u002Fp>\n\n  <p>Le rapport livré suit strictement la structure présentée dans ce livre blanc : tableau de bord R175, plan d'action hiérarchisé, et les quatre annexes obligatoires (texte du décret, méthodologie, justification des préconisations, mentions légales).<\u002Fp>\n\n  <div class=\"price-block\">\n    <div class=\"price-label\">Tarif forfaitaire<\u002Fdiv>\n    <p class=\"price\">4 000 — 5 000 € HT<\u002Fp>\n    <p class=\"price-sub\">par bâtiment, <strong>frais de déplacement inclus<\u002Fstrong> (généralement deux visites sur site). Le prix qui permet de produire un audit de qualité, opposable face à un contrôle, et exploitable directement par les intégrateurs.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"cta-block\">\n    <span class=\"cta-label\">Pour demander un devis ou poser une question<\u002Fspan>\n    <a href=\"mailto:contact@buildy.fr\">contact@buildy.fr<\u002Fa>\n    <a href=\"https://www.buildy.fr\">www.buildy.fr<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- 4ème de couverture                               -->\n<!-- =============================================== -->\n<section class=\"back\">\n  <div class=\"wordmark-top\">\n    <img src=\"9c4a25a2-35bf-4455-96e6-4dbc9463cf71\" alt=\"Buildy\">\n  <\u002Fdiv>\n\n  <div class=\"back-center\">\n    <h3>Une question sur ce livre blanc&nbsp;?<\u002Fh3>\n    <p class=\"contact\">Écrivez-moi : <a href=\"mailto:contact@buildy.fr\">contact@buildy.fr<\u002Fa><\u002Fp>\n    <p class=\"contact\"><a href=\"https://www.buildy.fr\">www.buildy.fr<\u002Fa><\u002Fp>\n\n    <div class=\"signature\">\n      <div class=\"rule\"><\u002Fdiv>\n      <div class=\"name\">Kévin BROCARD<\u002Fdiv>\n      <div class=\"role\">Fondateur, Buildy<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"back-foot\">\n    Livre blanc édité par Buildy. Version 1.0 — mai 2026. Le contenu de ce document est conforme à l'état du décret R175 du Code de la construction et de l'habitation à la date de publication. Toute évolution réglementaire ultérieure peut en modifier la portée. Ce document ne constitue pas un rapport d'audit ni un avis juridique opposable — il décrit la méthode utilisée par Buildy pour réaliser ses prestations d'audit. La reproduction partielle ou totale est libre à condition de mentionner la source.\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<\u002Fbody><\u002Fhtml>"
