  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n  .ico-cool{ background:var(--cool-bg); color:var(--cool); }\n  .ico-vent{ background:var(--vent-bg); color:var(--vent); }\n  .ico-ecs{ background:var(--ecs-bg); color:var(--ecs); }\n  .ico-light{ background:var(--light-bg); color:var(--light); }\n  .ico-pv{ background:var(--pv-bg); color:var(--pv); }\n  .ico-mint{ background:var(--mint-50); color:var(--mint-700); }\n  .ico-navy{ background:var(--navy); color:var(--white); }\n\n  /* === Step number === */\n  .step-num{\n    font-family:'Poppins',sans-serif;\n    font-size:96pt;\n    font-weight:800;\n    line-height:0.9;\n    letter-spacing:-0.06em;\n    color:var(--mint-500);\n    margin:0 0 8px 0;\n    opacity:0.95;\n  }\n  .chap-eyebrow .chip-num{\n    display:inline-block;\n    padding:3px 10px;\n    background:var(--mint-50);\n    color:var(--mint-700);\n    border-radius:999px;\n    margin-right:10px;\n    font-weight:700;\n    letter-spacing:0.04em;\n  }\n\n  /* Sev colored cells in big action table */\n  td.sev.bloq{ color:#991b1b; }\n  td.sev.maj{ color:#b45309; }\n  td.sev.min{ color:var(--mint-700); }\n\n  /* Running header on inner pages */\n  .page-header{\n    position:absolute;\n    top:14mm;\n    left:18mm;\n    right:18mm;\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n    font-family:'Manrope',sans-serif;\n    font-size:9pt;\n    font-weight:600;\n    line-height:1.4;\n    text-transform:uppercase;\n    letter-spacing:0.18em;\n    color:var(--gray-600);\n    border-bottom:1px solid var(--gray-300);\n    padding-bottom:4mm;\n  }\n  .page-header .head-chap{ letter-spacing:0.18em; }\n  .page-header .head-mark{\n    height:18px;\n    width:auto;\n    opacity:0.85;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- =============================================== -->\n<!-- COVER                                            -->\n<!-- =============================================== -->\n<section class=\"cover\">\n  <div class=\"cover-eyebrow\">\n    <img src=\"9c4a25a2-35bf-4455-96e6-4dbc9463cf71\" alt=\"Buildy\" style=\"height:32px; display:block; margin-bottom:24px;\">\n    Livre blanc\n    <span class=\"meta\">Audit BACS — Décret R175 · Version 1.0 · Mai 2026<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"cover-center\">\n    <h1 class=\"cover-title\">La méthode interne d'audit BACS de Buildy<\u002Fh1>\n    <p class=\"cover-sub\">La checklist qu'on utilise sur tous nos chantiers — livrée telle quelle, gratuitement.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"cover-foot\">\n    <div class=\"wordmark logo-lockup\">\n      <img src=\"9c4a25a2-35bf-4455-96e6-4dbc9463cf71\" alt=\"Buildy\">\n    <\u002Fdiv>\n    <div class=\"edition\">À l'attention des propriétaires<br>et gestionnaires de bâtiments tertiaires<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- PRÉAMBULE 1 — Ce que vous tenez                  -->\n<!-- =============================================== -->\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Préambule — Ce que vous tenez entre les mains<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\">Préambule<\u002Fdiv>\n  <h1 class=\"chapter-title\">Ce que vous tenez entre les mains<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"lead\">Ce livre blanc est la documentation interne de la méthode utilisée par les auditeurs Buildy pour structurer un audit BACS sur un bâtiment tertiaire. <strong>10 étapes, dans cet ordre, sans sauter.<\u002Fstrong><\u002Fp>\n\n  <p>C'est <em>la même structure<\u002Fem> que celle utilisée par notre équipe pour produire les rapports d'audit livrés aux propriétaires, asset managers et property managers de bâtiments tertiaires. Rien n'est retenu — pas de version premium cachée, pas de chapitre payant.<\u002Fp>\n\n  <h3>Pourquoi le publier ?<\u002Fh3>\n  <p>À la lecture, vous saurez si vous voulez le faire vous-même ou nous appeler. Les deux choix sont légitimes. Si vous gérez un seul bâtiment et que vous avez le temps, vous avez maintenant la méthode. Si vous gérez plusieurs sites ou que vous voulez aller vite, le pivot final de ce document vous indique comment nous joindre.<\u002Fp>\n\n  <div class=\"callout tip\">\n    <div class=\"callout-label\">À qui ce livre blanc s'adresse<\u002Fdiv>\n    <p>Propriétaires, asset managers, property managers, exploitants, AMO et bureaux d'études thermiques en charge de bâtiments tertiaires soumis au décret BACS. Pas aux intégrateurs GTB ni aux automaticiens — ce n'est pas la bonne grille de lecture pour eux.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"callout warn\">\n    <div class=\"callout-label\">⚠ Ce que ce livre blanc n'est pas<\u002Fdiv>\n    <p>Une plaquette commerciale. Un manuel d'utilisation d'une solution propriétaire. Un texte juridique opposable. Le rapport d'inspection périodique R175-5-1 (qui doit être réalisé par un organisme tiers indépendant — voir chapitre 8).<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">2<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- PRÉAMBULE 2 — Décret R175                        -->\n<!-- =============================================== -->\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Préambule — Le décret R175 en une page<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\">Préambule<\u002Fdiv>\n  <h1 class=\"chapter-title\">Le décret R175 en une page<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p>Le décret BACS (Building Automation and Control Systems), codifié aux articles R175-1 à R175-6 du Code de la construction et de l'habitation, impose à tous les bâtiments tertiaires de plus de 70 kW de chauffage ou de climatisation d'être équipés d'un système d'automatisation et de contrôle conforme.<\u002Fp>\n\n  <h3>Six articles structurent l'obligation<\u002Fh3>\n  <ul>\n    <li><strong>R175-1<\u002Fstrong> définit le périmètre — quels domaines de gestion technique sont concernés (chauffage, climatisation, ventilation, eau chaude sanitaire, éclairage, production photovoltaïque), et ce qu'est une zone fonctionnelle.<\u002Fli>\n    <li><strong>R175-2<\u002Fstrong> définit l'assujettissement — au-dessus de 290 kW, échéance immédiate ou au 1ᵉʳ janvier 2025 selon la date du permis de construire ; entre 70 et 290 kW, échéance au 1ᵉʳ janvier 2027. Les propriétaires sont dispensés de calculer le temps de retour sur investissement quand celui-ci dépasse les délais d'amortissement raisonnables.<\u002Fli>\n    <li><strong>R175-3<\u002Fstrong> définit les capacités fonctionnelles attendues du système : suivi continu des consommations à pas horaire et conservation des données sur cinq ans, détection des pertes d'efficacité, interopérabilité, possibilité d'arrêt manuel et de fonctionnement autonome, mise à disposition des données aux gestionnaires et aux exploitants.<\u002Fli>\n    <li><strong>R175-4<\u002Fstrong> impose des vérifications périodiques formalisées (carnet d'entretien, procédures écrites).<\u002Fli>\n    <li><strong>R175-5<\u002Fstrong> impose la formation de l'exploitant à l'utilisation du système.<\u002Fli>\n    <li><strong>R175-6<\u002Fstrong> impose une régulation thermique automatique par pièce ou par zone, applicable aux bâtiments dont le permis de construire ou les travaux générateurs sont postérieurs au 21 juillet 2021.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Ce que le décret n'impose pas<\u002Fh3>\n  <ul>\n    <li>Pas de norme produit obligatoire. La conformité est <em>fonctionnelle<\u002Fem> (on évalue ce que le système fait), pas <em>certificatoire<\u002Fem> (on n'exige pas de certification ISO 52120-1).<\u002Fli>\n    <li>Pas de marque imposée. Le décret est agnostique sur la solution déployée.<\u002Fli>\n    <li>Pas de calcul du temps de retour sur investissement systématique. C'est une décision du propriétaire.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Ce que le décret impose en plus de la mise en conformité technique<\u002Fh3>\n  <ul>\n    <li>Une <strong>inspection périodique R175-5-1<\u002Fstrong> réalisée par un organisme tiers indépendant. <em>Cet audit Buildy ne s'y substitue pas.<\u002Fem> Voir chapitre 8.<\u002Fli>\n    <li>La <strong>conservation du rapport d'audit pendant 10 ans<\u002Fstrong> et sa présentation lors d'éventuels contrôles préfectoraux.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">3<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 1                                       -->\n<!-- =============================================== -->\n<!-- TOC -->\n<section class=\"page\" id=\"toc\">\n  <div class=\"page-header\"><span class=\"head-chap\">Sommaire<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\">Sommaire<\u002Fdiv>\n  <h1 class=\"chapter-title\">Table des matières<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n  <p class=\"lead\">10 étapes, dans cet ordre, sans sauter. Cliquez pour rejoindre un chapitre.<\u002Fp>\n  <ul class=\"toc-list\">\n    <li><span class=\"num\">01<\u002Fspan><a class=\"title\" href=\"#ch1\">Identification &amp; cadrage R175-2<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">04<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">02<\u002Fspan><a class=\"title\" href=\"#ch2\">Découper le bâtiment en zones fonctionnelles<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">07<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">03<\u002Fspan><a class=\"title\" href=\"#ch3\">Inventaire des systèmes techniques et des équipements<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">11<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">04<\u002Fspan><a class=\"title\" href=\"#ch4\">Plan de comptage et suivi énergétique<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">17<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">05<\u002Fspan><a class=\"title\" href=\"#ch5\">Régulation thermique par zone<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">22<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">06<\u002Fspan><a class=\"title\" href=\"#ch6\">Évaluer la supervision existante<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">26<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">07<\u002Fspan><a class=\"title\" href=\"#ch7\">Check-list documentaire<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">33<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">08<\u002Fspan><a class=\"title\" href=\"#ch8\">Inspections périodiques R175-5-1 et accès techniques<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">37<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">09<\u002Fspan><a class=\"title\" href=\"#ch9\">Le plan d'action de mise en conformité<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">41<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">10<\u002Fspan><a class=\"title\" href=\"#ch10\">Synthèse et livraison du rapport<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">47<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">11<\u002Fspan><a class=\"title\" href=\"#ch11\">Les pièges à éviter après l'audit<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">52<\u002Fspan><\u002Fli>\n    <li><span class=\"num\">→<\u002Fspan><a class=\"title\" href=\"#conclusion\">Conclusion — récapitulatif<\u002Fa><span class=\"dots\"><\u002Fspan><span class=\"pg\">58<\u002Fspan><\u002Fli>\n  <\u002Ful>\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">—<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"ch1\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 1 / 11 — Cadrage R175-2<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">01<\u002Fspan> Chapitre 1 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Identification &amp; cadrage R175-2<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Vérifier que le bâtiment est bien assujetti. Avant tout travail terrain, il faut établir si le bâtiment est concerné par le décret BACS. Cette vérification est apparemment simple — elle ne l'est pas toujours.<\u002Fp>\n\n  <div class=\"pill-row\">\n    <span class=\"pill pill-navy\"><i class=\"fas fa-bolt\"><\u002Fi> R175-2<\u002Fspan>\n    <span class=\"pill pill-mint\"><i class=\"fas fa-gauge-high\"><\u002Fi> Puissance nominale<\u002Fspan>\n    <span class=\"pill pill-info\"><i class=\"fas fa-calendar\"><\u002Fi> Date permis<\u002Fspan>\n    <span class=\"pill pill-warn-soft\"><i class=\"fas fa-triangle-exclamation\"><\u002Fi> Échéance<\u002Fspan>\n  <\u002Fdiv>\n\n  <h2>Vérifier que le bâtiment est bien assujetti<\u002Fh2>\n\n  <p>L'assujettissement repose sur <strong>la puissance nominale cumulée<\u002Fstrong> des systèmes de chauffage et de climatisation du bâtiment, et sur la <strong>date du permis de construire<\u002Fstrong>. Trois cas de figure :<\u002Fp>\n\n  <ul>\n    <li><strong>Puissance supérieure à 290 kW.<\u002Fstrong> Le bâtiment est assujetti immédiatement s'il est antérieur au 1ᵉʳ janvier 2025 ; sinon échéance au 1ᵉʳ janvier 2025.<\u002Fli>\n    <li><strong>Puissance comprise entre 70 et 290 kW.<\u002Fstrong> Échéance au 1ᵉʳ janvier 2027.<\u002Fli>\n    <li><strong>Puissance inférieure à 70 kW.<\u002Fstrong> Le bâtiment n'est pas concerné par le décret.<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette grille d'analyse, identique pour tous les bâtiments, est la première chose que produit l'auditeur. Elle figure en page de couverture du rapport final, sous forme de verdict d'assujettissement explicite.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">4<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 1 / 11 — Cadrage R175-2<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Les pièges du calcul de puissance<\u002Fh2>\n  <p>Le calcul est rarement aussi direct qu'une simple addition de plaques signalétiques. Trois cas particuliers reviennent régulièrement et méritent un examen attentif.<\u002Fp>\n\n  <h3>Bâtiment raccordé à un réseau de chaleur urbain<\u002Fh3>\n  <p>La puissance à retenir n'est pas la puissance cumulée des émetteurs (radiateurs, planchers chauffants), mais celle de <strong>la sous-station d'échange<\u002Fstrong> qui raccorde le bâtiment au réseau urbain. C'est cette puissance qui figure dans le contrat de fourniture de chaleur — l'auditeur doit la vérifier physiquement et la comparer au document contractuel.<\u002Fp>\n\n  <h3>Pompes à chaleur réversibles<\u002Fh3>\n  <p>Une PAC réversible cumule chauffage et climatisation. Selon le mode dominant et le dimensionnement, elle peut basculer un bâtiment d'une catégorie à une autre. L'auditeur consigne la puissance nominale en mode chauffage <em>et<\u002Fem> en mode climatisation, et retient la valeur la plus pertinente au regard du calcul d'assujettissement.<\u002Fp>\n\n  <h3>Travaux récents sur les générateurs<\u002Fh3>\n  <p>Le décret R175-6 (régulation thermique automatique) a une applicabilité spécifique : il s'impose aux bâtiments dont le permis de construire <strong>ou<\u002Fstrong> les travaux générateurs (remplacement de chaudière, installation d'une PAC, etc.) sont postérieurs au 21 juillet 2021. L'auditeur consigne donc deux dates distinctes : permis de construire et derniers travaux générateurs significatifs. Cet écart est souvent oublié dans les pré-diagnostics rapides.<\u002Fp>\n\n  <h3>Dispense de calcul du temps de retour<\u002Fh3>\n  <p>Le décret R175-2 prévoit que les propriétaires sont dispensés de chiffrer le temps de retour sur investissement (TRI) lorsque celui-ci dépasse les délais d'amortissement raisonnables. La méthode Buildy ne calcule pas ce TRI — c'est une décision du propriétaire, qui en assume la responsabilité. Le rapport d'audit le rappelle explicitement.<\u002Fp>\n\n  <div class=\"callout warn\">\n    <div class=\"callout-label\">⚠ Vigilance<\u002Fdiv>\n    <p>Une erreur de calcul sur la puissance assujettissante invalide tout l'audit. C'est la première chose qu'un contrôle préfectoral vérifie. L'auditeur Buildy s'appuie sur les documents officiels (permis de construire, contrats de raccordement, plaques signalétiques relevées physiquement) — jamais sur une déclaration verbale du gestionnaire.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">5<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 1 / 11 — Cadrage R175-2<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Ce que produit cette étape<\u002Fh2>\n  <p>À l'issue du cadrage, le dossier d'audit contient :<\u002Fp>\n  <ul>\n    <li>La puissance nominale cumulée chauffage et climatisation, justifiée document à l'appui.<\u002Fli>\n    <li>La date du permis de construire et la date du dernier remplacement générateur significatif.<\u002Fli>\n    <li>Le statut d'assujettissement : <em>immédiat<\u002Fem>, <em>1ᵉʳ janvier 2025<\u002Fem>, <em>1ᵉʳ janvier 2027<\u002Fem>, ou <em>non assujetti<\u002Fem>.<\u002Fli>\n    <li>L'échéance réglementaire applicable au bâtiment.<\u002Fli>\n    <li>L'identification du raccordement éventuel à un réseau de chaleur urbain.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout tip\">\n    <div class=\"callout-label\">À retenir<\u002Fdiv>\n    <p><strong>Si le bâtiment est non assujetti<\u002Fstrong>, l'audit s'arrête ici. Le rapport produit reste utile : il documente le constat d'absence d'obligation et sécurise le propriétaire face à un contrôle ultérieur.<\u002Fp>\n    <p><strong>Si le bâtiment est assujetti<\u002Fstrong>, l'auditeur passe à l'étape 2 — le découpage du bâtiment en zones fonctionnelles, qui conditionne tout le travail terrain.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">6<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 2                                       -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch2\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 2 / 11 — Zones fonctionnelles<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">02<\u002Fspan> Chapitre 2 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Découper le bâtiment en zones fonctionnelles<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Le décret R175 ne s'applique pas à un bâtiment pris en bloc. Il s'applique <strong>zone par zone<\u002Fstrong>. Chaque zone fonctionnelle a ses propres systèmes attendus, ses propres compteurs requis, ses propres exigences de régulation.<\u002Fp>\n\n  <h2>Le découpage qui conditionne tout le reste<\u002Fh2>\n\n  <p>Découper correctement le bâtiment, c'est donc préparer toutes les étapes suivantes. Un découpage trop grossier (un seul plateau pour tous les bureaux d'un étage) masque des écarts de conformité ; un découpage trop fin (une zone par bureau individuel) dilue l'analyse et rend le rapport illisible.<\u002Fp>\n\n  <p><strong>La règle pratique<\u002Fstrong> : une zone fonctionnelle est un espace dont l'usage justifie un traitement réglementaire homogène. Un open-space et une salle de réunion attenante ne constituent pas la même zone — l'une a un occupant permanent et continu, l'autre a un usage intermittent. Un parking et un local technique ne constituent pas la même zone — l'un a une logique d'éclairage et de ventilation automatique liée à la détection de présence, l'autre d'éclairage de service ponctuel.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">7<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 2 / 11 — Zones fonctionnelles<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">La grille des natures de zone<\u002Fh2>\n\n  <p>L'auditeur s'appuie sur une grille de <strong>natures de zone<\u002Fstrong> pré-établie, qui couvre les usages les plus fréquents du bâtiment tertiaire français : bureaux partagés, bureaux privés, open-spaces, salles de réunion, espaces commerciaux, ateliers, locaux techniques, salles de classe, espaces de loisirs, foyers, couloirs, espaces extérieurs, locaux compteurs, espaces partagés, cellules logistiques, zones de stockage, et quelques autres cas spécifiques.<\u002Fp>\n\n  <p>Cette grille n'est pas arbitraire : elle découle d'une lecture méthodique du R175-1 §6 et d'un référentiel construit à partir des chantiers réalisés. Chaque nature de zone déclenche <strong>une grille d'attendus<\u002Fstrong> — quels systèmes techniques doivent normalement y être présents, quels compteurs sont requis, quelles exigences de régulation s'y appliquent.<\u002Fp>\n\n  <p>Par exemple :<\u002Fp>\n  <ul>\n    <li>Un open-space tertiaire appelle naturellement chauffage, climatisation, ventilation et éclairage intérieur.<\u002Fli>\n    <li>Un parking appelle éclairage et éventuellement ventilation mécanique selon le code du travail.<\u002Fli>\n    <li>Un local technique a un périmètre réduit — souvent juste éclairage de service.<\u002Fli>\n    <li>Une cellule logistique a un usage saisonnier qui peut justifier des modes de fonctionnement spécifiques.<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette grille d'attendus n'est pas une vérité absolue : elle aide l'auditeur à ne rien oublier sur le terrain et à justifier explicitement les absences. Si une zone a une nature atypique, elle est documentée comme telle et l'analyse est ajustée.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">8<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 2 / 11 — Zones fonctionnelles<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Pour chaque zone, ce que l'auditeur consigne<\u002Fh2>\n\n  <p>Pour chaque zone identifiée, le dossier d'audit comporte :<\u002Fp>\n  <ul>\n    <li><strong>Un nom<\u002Fstrong> — explicite, qui parle à l'exploitant (« Open-space N+1 Est », « Hall d'accueil », pas « Zone-12 »).<\u002Fli>\n    <li><strong>Une nature<\u002Fstrong> — choisie dans la grille évoquée page précédente.<\u002Fli>\n    <li><strong>Une surface<\u002Fstrong> — relevée si possible, estimée sinon, justifiée document à l'appui (plan, métré, base immobilière).<\u002Fli>\n    <li><strong>Des notes terrain<\u002Fstrong> — particularités observées sur place (orientation, hauteur sous plafond, occupation effective, contraintes d'accès).<\u002Fli>\n    <li><strong>Des photos<\u002Fstrong> — vues générales de la zone, qui resteront dans le rapport et serviront de mémoire pour le propriétaire et pour les auditeurs ultérieurs.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout r175\">\n    <div class=\"callout-label\">Cas du bâtiment multi-locataires<\u002Fdiv>\n    <p>Un immeuble de bureaux loué à plusieurs entreprises peut avoir des zones gérées par différents occupants, avec des supervisions distinctes (voire concurrentes). L'auditeur identifie ces frontières opérationnelles, qui ne coïncident pas toujours avec le découpage immobilier. Cette distinction est importante pour l'étape 6 (évaluation de la supervision) et pour l'étape 8 (collecte des contacts d'occupants).<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">9<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 2 / 11 — Zones fonctionnelles<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Pièges classiques<\u002Fh2>\n  <ul>\n    <li><strong>Confondre zone réglementaire et zone climatique de la GTB.<\u002Fstrong> La supervision existante a souvent un découpage technique (boucles de chauffage, zones de ventilation) qui ne reflète pas le découpage fonctionnel attendu par le décret. L'auditeur applique la grille du décret, pas celle de l'installateur.<\u002Fli>\n    <li><strong>Oublier les espaces communs.<\u002Fstrong> Couloirs, halls, sanitaires partagés, locaux à vélos : ils ne génèrent pas toujours d'obligation forte mais doivent être tracés pour justifier la complétude.<\u002Fli>\n    <li><strong>Sous-estimer les surfaces.<\u002Fstrong> Une mesure approximative à la fin du chantier vaut mieux qu'une absence de mesure. Le décret n'impose pas une précision millimétrique, mais l'absence totale de surface fragilise le rapport.<\u002Fli>\n    <li><strong>Doubler une zone parce qu'elle change d'occupant.<\u002Fstrong> Si la nature de l'usage est identique (un même open-space loué à deux entreprises), une seule zone suffit, avec mention des occupants en notes.<\u002Fli>\n  <\u002Ful>\n\n  <h2>Ce que produit cette étape<\u002Fh2>\n  <p>À l'issue du découpage, le dossier d'audit comporte :<\u002Fp>\n  <ul>\n    <li>La liste exhaustive des zones du bâtiment, nommées et qualifiées par nature.<\u002Fli>\n    <li>La surface de chaque zone, avec sa source.<\u002Fli>\n    <li>Les notes terrain et photos associées.<\u002Fli>\n    <li>Pour chaque zone, la grille d'attendus réglementaires (systèmes attendus, compteurs requis, exigences spécifiques).<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette grille est l'ossature de tout le travail terrain qui suit. Aux étapes 3, 4 et 5, l'auditeur passera zone par zone, en confrontant systématiquement l'attendu réglementaire à l'observé sur le terrain. Tout écart sera tracé, qualifié, et alimentera le plan d'action de l'étape 9.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">10<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 3                                       -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch3\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 3 / 11 — Inventaire des systèmes techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">03<\u002Fspan> Chapitre 3 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Inventaire des systèmes techniques et des équipements<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">C'est ici que se fait le gros du travail d'un audit BACS. Avant de regarder la supervision en place, avant de chiffrer un plan d'action, il faut savoir exactement <strong>ce qu'il y a dans le bâtiment<\u002Fstrong>. Sans cet inventaire, le décret R175-3 ne s'applique sur rien.<\u002Fp>\n\n  <div class=\"icon-grid\">\n    <div class=\"icon-chip\"><div class=\"ico ico-heat\"><i class=\"fas fa-fire\"><\u002Fi><\u002Fdiv><div><div class=\"lbl\">Chauffage<\u002Fdiv><div class=\"sub\">Chaudière, PAC, réseau de chaleur<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"icon-chip\"><div class=\"ico ico-cool\"><i class=\"fas fa-snowflake\"><\u002Fi><\u002Fdiv><div><div class=\"lbl\">Climatisation<\u002Fdiv><div class=\"sub\">Groupe froid, DRV, free-cooling<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"icon-chip\"><div class=\"ico ico-vent\"><i class=\"fas fa-fan\"><\u002Fi><\u002Fdiv><div><div class=\"lbl\">Ventilation<\u002Fdiv><div class=\"sub\">CTA, VMC, extraction<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"icon-chip\"><div class=\"ico ico-ecs\"><i class=\"fas fa-droplet\"><\u002Fi><\u002Fdiv><div><div class=\"lbl\">Eau chaude sanitaire<\u002Fdiv><div class=\"sub\">Ballon, instantané, solaire<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"icon-chip\"><div class=\"ico ico-light\"><i class=\"fas fa-lightbulb\"><\u002Fi><\u002Fdiv><div><div class=\"lbl\">Éclairage intérieur<\u002Fdiv><div class=\"sub\">LED, fluo, dimming<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"icon-chip\"><div class=\"ico ico-pv\"><i class=\"fas fa-solar-panel\"><\u002Fi><\u002Fdiv><div><div class=\"lbl\">Production PV<\u002Fdiv><div class=\"sub\">Toiture, ombrières, BIPV<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"icon-chip\"><div class=\"ico ico-mint\"><i class=\"fas fa-gauge-high\"><\u002Fi><\u002Fdiv><div><div class=\"lbl\">Comptage<\u002Fdiv><div class=\"sub\">Sous-comptage par usage et par zone<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2>Pourquoi cette étape conditionne tout le reste<\u002Fh2>\n\n  <p>Pour chaque zone fonctionnelle découpée à l'étape 2, l'auditeur procède en trois temps :<\u002Fp>\n  <ol>\n    <li>Recenser les <strong>systèmes techniques<\u002Fstrong> présents par catégorie réglementaire (chauffage, climatisation, etc.).<\u002Fli>\n    <li>Pour chaque système, identifier les <strong>équipements concrets<\u002Fstrong> qui le composent (chaudière, pompe à chaleur, centrale de traitement d'air…).<\u002Fli>\n    <li>Pour chaque équipement, qualifier sa <strong>conformité au décret<\u002Fstrong> — interopérabilité, possibilité d'arrêt manuel, fonctionnement autonome.<\u002Fli>\n  <\u002Fol>\n\n  <p>À la fin de l'étape, chaque exigence du R175-3 §3 (interopérabilité) et §4 (arrêt + autonomie) est documentée équipement par équipement. C'est cette granularité qui permet, plus tard, d'élaborer un plan d'action <em>chiffrable<\u002Fem>. Sans elle, vous saurez qu'il y a un problème de conformité, mais vous ne pourrez pas estimer combien il coûtera à corriger.<\u002Fp>\n\n  <div class=\"callout r175\">\n    <div class=\"callout-label\">Rappel R175-1 §4<\u002Fdiv>\n    <p>Les domaines de gestion technique concernés par le décret sont strictement délimités. La méthode d'audit Buildy s'aligne sur cette liste, sans y ajouter d'éléments hors périmètre (sécurité incendie, contrôle d'accès, etc.).<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">11<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 3 / 11 — Inventaire des systèmes techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Les six catégories de systèmes techniques<\u002Fh2>\n\n  <p>L'auditeur examine systématiquement chaque zone à la lumière de <strong>six catégories<\u002Fstrong> de gestion technique : chauffage, climatisation, ventilation, eau chaude sanitaire, éclairage intérieur, production photovoltaïque. Pour chacune, il détermine si la zone est concernée — et, si oui, dans quelle mesure.<\u002Fp>\n\n  <p>Trois statuts sont possibles : système <strong>présent<\u002Fstrong> (et opérationnel), <strong>absent<\u002Fstrong> (la zone n'en dispose pas), ou <strong>non concerné<\u002Fstrong> (l'absence est justifiée par la nature de la zone — par exemple, un local technique sans éclairage permanent).<\u002Fp>\n\n  <p>Le travail ne s'arrête pas à ce constat. Pour chaque catégorie présente, l'auditeur documente également le degré d'intégration à la supervision existante du bâtiment, et consigne ses observations terrain (typologie, état apparent, contraintes d'accès, anomalies remarquées).<\u002Fp>\n\n  <p><strong>La nature de la zone (consignée à l'étape 2) oriente l'analyse<\u002Fstrong> : un open-space appelle naturellement chauffage, climatisation, ventilation et éclairage ; un parking appelle éclairage et éventuellement ventilation ; un local technique a souvent un périmètre réduit. Cette grille d'attendus, construite à partir d'une lecture méthodique du décret, évite à l'auditeur d'oublier des systèmes attendus — et l'aide à justifier les absences.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">12<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 3 / 11 — Inventaire des systèmes techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Le détail des équipements<\u002Fh2>\n\n  <p>Lister la catégorie ne suffit pas. Pour que le décret puisse être évalué, il faut descendre à <strong>l'équipement concret<\u002Fstrong>. Pour chaque catégorie marquée présente, l'auditeur recense un ou plusieurs équipements et établit pour chacun une fiche détaillée.<\u002Fp>\n\n  <p>Cette fiche couvre quatre familles d'informations :<\u002Fp>\n  <ul>\n    <li><strong>Identification<\u002Fstrong> : marque, modèle, référence, identifiant interne stable pour le suivi.<\u002Fli>\n    <li><strong>Caractéristiques techniques<\u002Fstrong> : puissance nominale, source d'énergie, rôle dans la chaîne thermique (production, distribution, émission, régulation).<\u002Fli>\n    <li><strong>Connectivité et supervision<\u002Fstrong> : protocole de communication, mode de raccordement, niveau d'intégration à la supervision existante.<\u002Fli>\n    <li><strong>État et conformité réglementaire<\u002Fstrong> : équipement en service ou pas, possibilité d'arrêt manuel, fonctionnement autonome en cas de défaut de la supervision.<\u002Fli>\n  <\u002Ful>\n\n  <p>Les valeurs autorisées pour chacune de ces dimensions sont volontairement étendues : la méthode couvre l'intégralité du parc tertiaire français — du gaz à la biomasse, de Modbus aux protocoles IP modernes, des installations centralisées aux équipements autonomes. Cette exhaustivité est le prix à payer pour qu'un même livrable soit opposable quel que soit le bâtiment audité.<\u002Fp>\n\n  <div class=\"callout warn\">\n    <div class=\"callout-label\">⚠ Cas particulier — équipement multi-zones<\u002Fdiv>\n    <p>Une centrale de traitement d'air alimentant trois plateaux de bureaux, ou un compteur électrique principal couvrant l'ensemble du bâtiment : ces équipements partagés sont identifiés une seule fois et rattachés à toutes les zones qu'ils desservent. C'est un point de vigilance important — un mauvais rattachement génère soit des doublons dans le plan d'action, soit, pire, des oublis.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">13<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 3 / 11 — Inventaire des systèmes techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Comment se déduit la conformité R175-3<\u002Fh2>\n\n  <p>Une fois l'inventaire complet, la conformité R175-3 §3 et §4 s'apprécie <strong>équipement par équipement<\u002Fstrong>.<\u002Fp>\n\n  <h3>R175-3 §3 — Interopérabilité<\u002Fh3>\n  <p>L'équipement est conforme s'il s'intègre à un système d'information du bâtiment via un protocole de communication standard. Il est non conforme s'il fonctionne en îlot, sans liaison avec une supervision (équipement strictement autonome, ou communicant uniquement avec sa propre télécommande propriétaire).<\u002Fp>\n\n  <h3>R175-3 §4 — Arrêt manuel et fonctionnement autonome<\u002Fh3>\n  <p>Deux exigences distinctes, à apprécier séparément :<\u002Fp>\n  <ul>\n    <li><strong>Arrêt manuel possible<\u002Fstrong> : l'utilisateur peut-il arrêter manuellement l'équipement, sans passer par la supervision (interrupteur physique, commande locale sur l'équipement, vanne d'isolement…) ?<\u002Fli>\n    <li><strong>Fonctionnement autonome<\u002Fstrong> : en cas de défaut de la supervision ou d'arrêt manuel, l'équipement assure-t-il une fonction minimale de sécurité (hors gel, ventilation de secours, éclairage de sécurité…) ?<\u002Fli>\n  <\u002Ful>\n\n  <p>Si l'une des deux exigences n'est pas tenue, l'équipement entre dans le plan d'action de l'étape 9, avec une sévérité majeure.<\u002Fp>\n\n  <h3>Liaison de supervision rompue<\u002Fh3>\n  <p>Cas fréquent : un équipement est intégré à la supervision sur le papier, mais sur le terrain, plus aucune valeur ne remonte (sonde déconnectée, switch en panne, configuration perdue après remplacement de matériel actif…). La méthode trace ces écarts à part, parce qu'ils relèvent d'une action corrective spécifique — rétablir la liaison existante — distincte d'une absence d'intégration.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">14<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 3 / 11 — Inventaire des systèmes techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Combien d'équipements pour un bâtiment typique<\u002Fh2>\n\n  <p>Le volume d'équipements à inventorier dépend strictement de la taille et de la nature du bâtiment, pas d'une moyenne théorique. Quelques ordres de grandeur :<\u002Fp>\n\n  <ul>\n    <li><strong>Un commerce de centre-ville<\u002Fstrong> : une zone, deux ou trois systèmes, trois à cinq équipements.<\u002Fli>\n    <li><strong>Un plateau de bureaux<\u002Fstrong> : trois à cinq zones, cinq systèmes, dix à quinze équipements.<\u002Fli>\n    <li><strong>Un siège social de 30 000 m²<\u002Fstrong> : trente à soixante zones, six à sept systèmes, plus d'une centaine d'équipements répartis par étage et par catégorie.<\u002Fli>\n  <\u002Ful>\n\n  <p>Pour chaque équipement, l'auditeur produit la fiche décrite en page 3, prend une à trois photos, et évalue la conformité R175-3 §3 et §4. C'est cette densité qui fait que <strong>l'étape 3 représente à elle seule entre 30 % et 50 % du temps total de l'audit terrain<\u002Fstrong>.<\u002Fp>\n\n  <h2>Pièges classiques<\u002Fh2>\n  <p>Cette page liste les écarts les plus fréquents entre le déclaratif et la réalité — détectables uniquement parce que l'auditeur descend systématiquement au niveau de l'équipement.<\u002Fp>\n  <ul>\n    <li><strong>Équipement déclaré « communicant » mais non vu de la supervision<\u002Fstrong> → liaison rompue, à tracer comme telle, génère une action corrective spécifique.<\u002Fli>\n    <li><strong>Pompe à chaleur ou DRV remplacés récemment<\u002Fstrong> sans mise à jour de l'analyse fonctionnelle → la supervision voit encore l'ancien équipement, l'écart doit être documenté.<\u002Fli>\n    <li><strong>Sous-compteur installé mais jamais raccordé<\u002Fstrong> → présent physiquement, non communicant — déclenche l'action « raccorder le compteur » à l'étape suivante.<\u002Fli>\n    <li><strong>Centrale de traitement d'air alimentant plusieurs zones<\u002Fstrong> → bien identifier le partage pour ne pas dédoubler les actions correctives.<\u002Fli>\n    <li><strong>Équipement « hors service » qui disparaît du dossier<\u002Fstrong> → il doit rester tracé dans l'inventaire et apparaître dans le rapport avec mention explicite. Important pour la traçabilité, et utile au gestionnaire pour planifier le remplacement.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">15<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 3 / 11 — Inventaire des systèmes techniques<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"callout r175\">\n    <div class=\"callout-label\">Référence R175<\u002Fdiv>\n    <p>Les exigences évaluées dans cette étape sont les articles R175-1 §4 (périmètre), R175-3 §3 (interopérabilité) et R175-3 §4 (arrêt manuel + autonomie). Le texte intégral de ces articles se trouve dans l'annexe A du rapport d'audit.<\u002Fp>\n  <\u002Fdiv>\n\n  <h2>Fin du chapitre — ce que l'étape produit<\u002Fh2>\n\n  <p>À l'issue de l'étape 3, le dossier d'audit comporte :<\u002Fp>\n  <ul>\n    <li>Une cartographie complète des systèmes techniques par zone fonctionnelle.<\u002Fli>\n    <li>Une fiche détaillée par équipement, avec marque, modèle, puissance, source d'énergie, protocole de communication, rôle dans la chaîne thermique.<\u002Fli>\n    <li>Pour chaque équipement, l'évaluation des R175-3 §3 et §4.<\u002Fli>\n    <li>Les photos terrain associées à chaque équipement.<\u002Fli>\n  <\u002Ful>\n\n  <p>Ces données alimentent ensuite :<\u002Fp>\n  <ul>\n    <li>L'étape 4 (plan de comptage) — qui doit être cohérente avec les puissances et énergies déclarées ici.<\u002Fli>\n    <li>L'étape 5 (régulation thermique) — qui s'appuie sur les équipements de chauffage/climatisation de cette étape.<\u002Fli>\n    <li>L'étape 6 (supervision existante) — qui évalue dans quelle mesure cet inventaire est effectivement piloté.<\u002Fli>\n    <li>L'étape 9 (plan d'action) — qui transforme les écarts détectés ici en actions correctives chiffrées.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout tip\">\n    <div class=\"callout-label\">À retenir<\u002Fdiv>\n    <p><strong>Sans cette étape proprement faite, les six suivantes sont fausses.<\u002Fstrong><\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">16<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 4                                       -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch4\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 4 / 11 — Plan de comptage<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">04<\u002Fspan> Chapitre 4 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Plan de comptage et suivi énergétique<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Le R175-3 §1 impose un suivi continu des consommations à pas horaire, conservées sur cinq ans. C'est l'exigence la plus simple à formuler du décret — et la plus fréquemment incomplète sur les bâtiments tertiaires existants.<\u002Fp>\n\n  <h2>Pourquoi le comptage est le point le plus structurant<\u002Fh2>\n\n  <p>Il y a deux raisons à cela. D'abord, le comptage a longtemps été pensé pour la facturation, pas pour le pilotage : un compteur général en pied d'immeuble suffisait à l'exploitant pour répartir une facture, mais ne permet pas de détecter une dérive zone par zone. Ensuite, la sous-comptage a été ajouté progressivement, par lots, sans logique d'ensemble — on trouve des sous-compteurs installés mais jamais raccordés à la supervision, ou raccordés mais avec un protocole obsolète.<\u002Fp>\n\n  <p>L'étape 4 consiste à confronter méthodiquement <strong>l'exigence du décret<\u002Fstrong> (un compteur par usage et par zone, communicant et conservant cinq ans d'historique) à <strong>la réalité physique<\u002Fstrong> du bâtiment. Chaque écart entre les deux génère, à l'étape 9, une action corrective chiffrable.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">17<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 4 / 11 — Plan de comptage<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">La matrice usage × zone<\u002Fh2>\n\n  <p>L'auditeur construit une matrice à deux dimensions : <strong>les usages réglementaires en colonnes<\u002Fstrong> (chauffage, climatisation, eau chaude sanitaire, éclairage, production photovoltaïque, et un usage <em>général<\u002Fem> pour le hors-périmètre), et <strong>les zones fonctionnelles en lignes<\u002Fstrong> (telles que découpées à l'étape 2).<\u002Fp>\n\n  <p>Pour chaque case, deux questions :<\u002Fp>\n  <ol>\n    <li><strong>Un compteur est-il requis ?<\u002Fstrong> La réponse découle de la nature de la zone et des systèmes présents. Une zone qui n'a pas de chauffage n'appelle pas de compteur de chauffage. Une zone qui a du chauffage et qui dépasse une certaine puissance en appelle un.<\u002Fli>\n    <li><strong>Un compteur est-il physiquement présent ?<\u002Fstrong> Réponse par observation directe sur le terrain.<\u002Fli>\n  <\u002Fol>\n\n  <p>Ces deux questions construisent la grille de conformité du comptage. La matrice complète, pour un bâtiment moyen, peut compter plusieurs dizaines de cases — chacune devant être examinée, justifiée, et photographiée si un compteur est présent.<\u002Fp>\n\n  <div class=\"callout r175\">\n    <div class=\"callout-label\">Compteurs partagés<\u002Fdiv>\n    <p>Un compteur peut couvrir plusieurs zones (compteur principal de chauffage qui dessert plusieurs étages, par exemple). L'auditeur identifie ces compteurs partagés une seule fois, en les rattachant à toutes les zones qu'ils desservent. Cela évite les doublons dans le plan d'action et reflète la réalité du parc compteur.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">18<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 4 / 11 — Plan de comptage<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Pour chaque compteur, ce que l'auditeur consigne<\u002Fh2>\n\n  <p>Pour chaque compteur identifié — qu'il soit présent, manquant ou hors service — le dossier comporte :<\u002Fp>\n  <ul>\n    <li><strong>Type de compteur<\u002Fstrong> : électrique, gaz, eau, thermique, électrique de production photovoltaïque.<\u002Fli>\n    <li><strong>Usage couvert<\u002Fstrong> : chauffage, climatisation, ECS, éclairage, production PV, ou général.<\u002Fli>\n    <li><strong>Zone(s) desservie(s)<\u002Fstrong> : selon le découpage de l'étape 2.<\u002Fli>\n    <li><strong>Présence physique constatée<\u002Fstrong> sur le terrain (observation directe, photo).<\u002Fli>\n    <li><strong>Communication effective<\u002Fstrong> : le compteur remonte-t-il réellement ses données vers une supervision, à un pas suffisant ?<\u002Fli>\n    <li><strong>Mode de raccordement<\u002Fstrong> : filaire ou sans-fil, protocole utilisé.<\u002Fli>\n    <li><strong>Intégration à la supervision existante<\u002Fstrong> : le compteur est-il vu de la GTB, et la liaison est-elle opérationnelle ?<\u002Fli>\n    <li><strong>État<\u002Fstrong> : en service, hors service, ou installé mais non raccordé.<\u002Fli>\n    <li><strong>Notes terrain<\u002Fstrong> et photos associées.<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette consignation systématique permet à l'étape suivante (l'élaboration du plan d'action) de qualifier précisément la nature de chaque action requise — installer un compteur manquant, raccorder un compteur existant, remplacer un compteur défaillant, ou mettre à niveau le protocole d'un compteur trop ancien.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">19<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 4 / 11 — Plan de comptage<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Comment se déduit la conformité R175-3 §1<\u002Fh2>\n\n  <p>À partir de la matrice complète, le dossier consolide la liste des actions correctives à mener pour atteindre la conformité. Trois cas se distinguent :<\u002Fp>\n\n  <ul>\n    <li><strong>Compteur requis mais physiquement absent<\u002Fstrong> → action <strong>bloquante<\u002Fstrong>. Sans ce compteur, l'exigence R175-3 §1 ne peut pas être tenue. Le rapport identifie l'usage et la zone concernés, et propose une typologie de compteur à installer.<\u002Fli>\n    <li><strong>Compteur présent mais non communicant<\u002Fstrong> → action <strong>majeure<\u002Fstrong>. L'équipement existe physiquement mais ne remonte pas ses données vers la supervision. La conformité R175-3 §1 (suivi continu) n'est pas tenue tant que la liaison n'est pas établie.<\u002Fli>\n    <li><strong>Compteur présent et communicant, mais avec une rétention insuffisante<\u002Fstrong> → action <strong>majeure<\u002Fstrong> également, à traiter dans l'étape 6 (évaluation de la supervision), car c'est la supervision qui porte la conservation cinq ans, pas le compteur lui-même.<\u002Fli>\n  <\u002Ful>\n\n  <p>Les compteurs hors service sont tracés pour mémoire, mais ne génèrent pas d'action corrective tant qu'aucun compteur ne les remplace.<\u002Fp>\n\n  <h2>Pièges classiques<\u002Fh2>\n  <ul>\n    <li><strong>Sous-compteur installé mais jamais raccordé.<\u002Fstrong> Cas le plus fréquent. Il faut vérifier physiquement le câblage et le protocole, pas se fier au déclaratif de l'exploitant.<\u002Fli>\n    <li><strong>Compteur communicant en local, pas vers la supervision.<\u002Fstrong> Beaucoup de compteurs modernes ont un afficheur local qui suggère qu'ils remontent leurs données — alors qu'ils ne remontent rien à la supervision. Vérification à faire sur la console GTB, pas sur le compteur.<\u002Fli>\n    <li><strong>Compteur partagé entre zones, déclaré sur une seule.<\u002Fstrong> Risque de doublonner les actions correctives. L'auditeur identifie le partage explicitement.<\u002Fli>\n    <li><strong>Compteur existant mais avec un protocole obsolète<\u002Fstrong> (ex. boucle d'impulsions sans téléreport). Le compteur est physiquement présent, mais incapable de remonter à pas horaire. C'est une action majeure de mise à niveau.<\u002Fli>\n    <li><strong>Confondre comptage et sous-facturation.<\u002Fstrong> Le décret R175-3 §1 vise le pilotage énergétique, pas la facturation aux occupants. Un bâtiment peut être conforme à la sous-facturation (loi Élan) sans être conforme R175-3 §1.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">20<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 4 / 11 — Plan de comptage<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"callout r175\">\n    <div class=\"callout-label\">Référence R175<\u002Fdiv>\n    <p>L'exigence évaluée ici est l'article R175-3 §1 (suivi continu, pas horaire, conservation cinq ans). Le texte intégral figure dans l'annexe A du rapport d'audit.<\u002Fp>\n  <\u002Fdiv>\n\n  <h2>Ce que produit cette étape<\u002Fh2>\n  <p>À l'issue de l'étape 4, le dossier d'audit comporte :<\u002Fp>\n  <ul>\n    <li>La matrice complète usage × zone, renseignée case par case.<\u002Fli>\n    <li>Pour chaque compteur identifié, sa fiche détaillée (type, usage, zone, état, communication).<\u002Fli>\n    <li>Les photos terrain associées à chaque compteur présent.<\u002Fli>\n    <li>La liste préliminaire des actions correctives liées au comptage, classées par sévérité.<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette liste alimente directement l'étape 9 (plan d'action), où chaque manque sera chiffré. Elle alimente aussi l'étape 6 (supervision existante), où l'on évaluera la capacité de la supervision à exploiter les compteurs présents — conservation cinq ans, restitution graphique, alertes sur dérives.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">21<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 5                                       -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch5\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 5 / 11 — Régulation thermique<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">05<\u002Fspan> Chapitre 5 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Régulation thermique par zone<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Le R175-6 impose une <strong>régulation thermique automatique par pièce ou par zone<\u002Fstrong>. Cette obligation a une applicabilité particulière : elle ne concerne pas tous les bâtiments soumis au décret BACS, mais uniquement ceux dont le permis de construire <strong>ou<\u002Fstrong> les travaux générateurs significatifs sont postérieurs au 21 juillet 2021.<\u002Fp>\n\n  <h2>Quand le R175-6 s'applique<\u002Fh2>\n\n  <p>C'est l'une des subtilités du décret. Un bâtiment ancien soumis au R175 par sa puissance peut très bien ne pas être concerné par le R175-6 — son installation thermique antérieure est protégée par la date d'antériorité. Un bâtiment qui a remplacé sa chaudière en 2023 voit en revanche le R175-6 s'imposer à lui, même si le bâtiment lui-même est plus ancien.<\u002Fp>\n\n  <p>L'auditeur consigne donc deux dates au début de cette étape : la date du permis de construire (déjà tracée à l'étape 1) et <strong>la date des derniers travaux générateurs significatifs<\u002Fstrong> — remplacement de chaudière, installation d'une PAC, raccordement à un réseau de chaleur, dépose d'une cuve à fioul. C'est cette seconde date qui déclenche, ou non, l'applicabilité du R175-6.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">22<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 5 / 11 — Régulation thermique<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Les trois niveaux de régulation à examiner<\u002Fh2>\n\n  <p>Sur les zones où le R175-6 s'applique, l'auditeur examine la régulation à trois niveaux d'équipement, indépendamment :<\u002Fp>\n\n  <ul>\n    <li><strong>Production<\u002Fstrong> — comment la chaleur (ou le froid) est-elle générée et modulée ? Régulation TOR sur thermostat d'ambiance, régulation à loi d'eau, asservissement sur sonde extérieure, etc.<\u002Fli>\n    <li><strong>Distribution<\u002Fstrong> — comment l'énergie est-elle acheminée vers les zones ? Vannes trois voies, pompes à débit variable, régulation par zone hydraulique.<\u002Fli>\n    <li><strong>Émission<\u002Fstrong> — comment l'énergie est-elle restituée dans la pièce ? Robinets thermostatiques sur radiateurs, régulation terminale par sonde locale, ventilo-convecteurs avec sonde de reprise.<\u002Fli>\n  <\u002Ful>\n\n  <p>Ces trois niveaux sont distincts. Une installation peut être conforme à la production (chaudière à condensation moderne, bien régulée) tout en étant non conforme à l'émission (radiateurs sans robinet thermostatique, donc impossibles à moduler par pièce). Le rapport doit qualifier chacun des trois niveaux.<\u002Fp>\n\n  <p>Pour chaque niveau, l'auditeur identifie également <strong>l'équipement contrôleur<\u002Fstrong> — la régulation est-elle assurée par un thermostat d'ambiance dédié, par un automate intégré à la GTB, par un relais simple ? Cette identification permet de chiffrer les actions correctives à l'étape 9 (changer un thermostat coûte une centaine d'euros ; reconfigurer un automate de GTB est un autre ordre de grandeur).<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">23<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 5 / 11 — Régulation thermique<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Les exemptions et cas particuliers<\u002Fh2>\n\n  <p>Le R175-6 prévoit explicitement plusieurs exemptions qu'il faut savoir reconnaître pour ne pas générer d'actions inutiles :<\u002Fp>\n\n  <ul>\n    <li><strong>Générateurs à biomasse<\u002Fstrong> (poêles à granulés, inserts, chaudières bois). Exemption explicite du décret. L'auditeur consigne l'exemption pour traçabilité, mais ne génère aucune action.<\u002Fli>\n    <li><strong>Locaux non chauffés ou non climatisés.<\u002Fstrong> Pas de régulation à examiner — l'auditeur consigne l'absence du système.<\u002Fli>\n    <li><strong>Locaux à régulation manuelle assumée<\u002Fstrong> (certains ateliers, locaux techniques avec personnel qualifié). À documenter explicitement avec justification, pas à laisser implicite.<\u002Fli>\n    <li><strong>Bâtiments en travaux ou en transition<\u002Fstrong> (changement de générateur prévu dans les douze mois). L'auditeur trace l'état actuel et signale la transition à venir, qui pourra rendre certaines actions caduques.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout warn\">\n    <div class=\"callout-label\">⚠ Position des sondes<\u002Fdiv>\n    <p>L'auditeur vérifie systématiquement la position physique des sondes de température. Une sonde mal placée (au-dessus d'un radiateur, en plein soleil, à moins d'un mètre du sol contre une cloison froide) fausse toute la régulation, même si le matériel est récent. C'est un constat fréquent, qui n'apparaît dans aucun document mais qui change la nature de l'action à mener (recalibrer ou repositionner, plutôt que remplacer).<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">24<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 5 / 11 — Régulation thermique<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Pièges classiques<\u002Fh2>\n  <ul>\n    <li><strong>Confondre conformité du matériel et conformité de la régulation effective.<\u002Fstrong> Une vanne thermostatique installée mais bloquée à l'ouverture maximale par les occupants (pour éviter les courants d'air) ne régule plus rien. L'observation terrain prime sur le déclaratif.<\u002Fli>\n    <li><strong>Sous-estimer les générateurs hybrides.<\u002Fstrong> Une PAC en relève d'une chaudière gaz, ou inversement, demande une analyse au cas par cas. La régulation peut être conforme sur l'un et pas sur l'autre.<\u002Fli>\n    <li><strong>Oublier la régulation de la climatisation.<\u002Fstrong> Le R175-6 vise <em>toute<\u002Fem> régulation thermique, pas uniquement le chauffage. Une climatisation centralisée sans modulation par zone est non conforme au même titre qu'un chauffage central sans robinet thermostatique.<\u002Fli>\n    <li><strong>Considérer l'exemption bois comme automatique.<\u002Fstrong> L'exemption ne s'applique qu'au générateur à biomasse, pas à toute l'installation. Un bâtiment chauffé par chaudière bois plus PAC d'appoint conserve les obligations sur la PAC.<\u002Fli>\n  <\u002Ful>\n\n  <h2>Ce que produit cette étape<\u002Fh2>\n  <p>À l'issue de l'étape 5, le dossier d'audit comporte :<\u002Fp>\n  <ul>\n    <li>L'identification des zones où le R175-6 est applicable, avec date d'applicabilité justifiée.<\u002Fli>\n    <li>Pour chaque zone applicable, l'examen des trois niveaux (production, distribution, émission), avec identification de l'équipement contrôleur.<\u002Fli>\n    <li>La consignation des exemptions (biomasse notamment) avec leur justification.<\u002Fli>\n    <li>Les observations terrain critiques (position des sondes, présence et état des robinets thermostatiques, modulations de zone).<\u002Fli>\n    <li>La liste préliminaire des actions correctives R175-6, classées par sévérité.<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette analyse alimente l'étape 9 (plan d'action) et précise les actions des étapes 3 et 4 (équipements, comptages) lorsqu'elles touchent à la chaîne thermique.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">25<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =============================================== -->\n<!-- CHAPITRE 6                                       -->\n<!-- =============================================== -->\n<section class=\"page\" id=\"ch6\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 6 / 11 — Supervision existante<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <div class=\"chap-eyebrow\"><span class=\"chip-num\">06<\u002Fspan> Chapitre 6 / 11<\u002Fdiv>\n  <h1 class=\"chapter-title\">Évaluer la supervision existante<\u002Fh1>\n  <div class=\"chap-rule\"><\u002Fdiv>\n\n  <p class=\"chap-intro\">Sur la majorité des bâtiments tertiaires que nous auditons, <strong>il n'y a pas de supervision GTB en place<\u002Fstrong> — ou il y en a une, mais partielle, ancienne, hors service, ou rachetée par un nouvel exploitant qui n'en a plus le mode d'emploi.<\u002Fp>\n\n  <h2>Le constat majoritaire : pas de supervision, ou partielle<\u002Fh2>\n\n  <p>C'est un point important à comprendre avant de plonger dans cette étape : le décret BACS n'oblige pas à <em>avoir<\u002Fem> une GTB nominative. Il oblige à <em>remplir certaines fonctions<\u002Fem> — suivi continu, interopérabilité, détection de dérives, mise à disposition des données. Que ces fonctions soient assurées par une GTB historique de marque connue, par une supervision développée sur mesure, ou par une combinaison de deux solutions, le décret reste neutre tant que les fonctions sont effectivement tenues.<\u002Fp>\n\n  <p>L'étape 6 sert donc à deux choses, selon la situation rencontrée :<\u002Fp>\n  <ul>\n    <li><strong>Si une supervision existe<\u002Fstrong> : évaluer méthodiquement sa couverture des exigences R175-3, R175-4 et R175-5, sujet par sujet.<\u002Fli>\n    <li><strong>Si aucune supervision n'est en place<\u002Fstrong> : documenter précisément ce qui manque, pour pouvoir le chiffrer à l'étape 9.<\u002Fli>\n  <\u002Ful>\n\n  <p>Dans les deux cas, le travail produit une cartographie nette de la situation, qui sert de base au plan d'action.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">26<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 6 / 11 — Supervision existante<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Identifier la supervision en place<\u002Fh2>\n\n  <p>Avant d'évaluer, il faut identifier précisément. La supervision est rarement un objet unique et bien étiqueté ; c'est souvent un agrégat de plusieurs systèmes installés à différentes époques. L'auditeur consigne :<\u002Fp>\n\n  <ul>\n    <li><strong>La solution principale<\u002Fstrong> — nom commercial, marque, version si possible. Plus rarement, l'absence pure et simple.<\u002Fli>\n    <li><strong>La localisation physique<\u002Fstrong> des serveurs et automates principaux. Important pour l'accessibilité en cas d'intervention et pour les questions de cybersécurité.<\u002Fli>\n    <li><strong>Les modèles d'équipements actifs<\u002Fstrong> — automates programmables, passerelles, gateways protocolaires. Ces références conditionnent la pérennité (matériels en fin de vie commerciale, support constructeur arrêté, etc.).<\u002Fli>\n    <li><strong>Les protocoles supportés<\u002Fstrong> — c'est ce qui détermine la capacité de la supervision à dialoguer avec les équipements terrain (étape 3) et les compteurs (étape 4).<\u002Fli>\n    <li><strong>L'état général<\u002Fstrong> — en service, hors service, partiellement opérationnel.<\u002Fli>\n  <\u002Ful>\n\n  <p>Cette identification factuelle évite les jugements hâtifs. Une « vieille GTB qu'on dit obsolète » peut très bien être largement conforme aux exigences R175-3 — l'évaluation se fait sur les fonctions, pas sur l'année du matériel.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">27<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 6 / 11 — Supervision existante<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">Les domaines réellement pilotés<\u002Fh2>\n\n  <p>Le R175-1 §4 liste les domaines de gestion technique concernés par le décret. Toutes les installations ne pilotent pas tous ces domaines. L'auditeur examine, pour chaque domaine — chauffage, climatisation, ventilation, eau chaude sanitaire, éclairage — si la supervision en place le couvre effectivement, et avec quelle profondeur.<\u002Fp>\n\n  <p>Trois cas typiques :<\u002Fp>\n  <ul>\n    <li><strong>Domaine couvert et opérationnel<\u002Fstrong> — la supervision pilote, monitor, journalise. Conformité possible (à examiner sur les exigences R175-3 §1 et §2 ci-dessous).<\u002Fli>\n    <li><strong>Domaine couvert sur le papier, défaillant sur le terrain<\u002Fstrong> — la supervision est censée gérer le domaine, mais soit les équipements sont déconnectés (cas évoqué à l'étape 3 avec la liaison rompue), soit les fonctionnalités ne sont plus utilisées (paramètres obsolètes, alarmes désactivées). C'est une non-conformité partielle qui appelle des actions de remise à niveau, généralement moins coûteuses qu'un déploiement complet.<\u002Fli>\n    <li><strong>Domaine non couvert<\u002Fstrong> — la supervision ignore le domaine. Soit parce qu'il n'a jamais été intégré, soit parce que l'extension n'a pas suivi un changement d'usage du bâtiment. Action d'extension à chiffrer.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">28<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 6 / 11 — Supervision existante<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">L'évaluation R175-3 §1 et §2<\u002Fh2>\n\n  <p>Deux exigences fonctionnelles centrales du décret, à examiner avec précision.<\u002Fp>\n\n  <h3>R175-3 §1 — Suivi continu des consommations<\u002Fh3>\n  <p>L'auditeur vérifie trois choses :<\u002Fp>\n  <ul>\n    <li><strong>La continuité du suivi<\u002Fstrong> : la supervision enregistre-t-elle effectivement les consommations à un pas suffisant (horaire au minimum) ? Vérification sur la console, pas sur la documentation.<\u002Fli>\n    <li><strong>Le format d'archivage<\u002Fstrong> : les données sont-elles stockées dans une base structurée et exportable, ou dans un format propriétaire qui empêcherait toute migration ?<\u002Fli>\n    <li><strong>La rétention cinq ans<\u002Fstrong> : l'auditeur vérifie qu'on peut effectivement consulter une courbe de consommation d'il y a quatre ou cinq ans sur la console — pas seulement que la supervision <em>prétend<\u002Fem> conserver cinq ans. Le test concret se fait en demandant à voir une courbe de chauffage de l'hiver précédent, par exemple.<\u002Fli>\n  <\u002Ful>\n\n  <h3>R175-3 §2 — Détection des pertes d'efficacité<\u002Fh3>\n  <p>Cette exigence est souvent la plus mal couverte. Elle suppose que la supervision a été configurée avec des <strong>règles d'alerte sur les dérives<\u002Fstrong> — écart anormal de consommation à conditions équivalentes, baisse de COP d'une PAC, surconsommation hors plage horaire. L'auditeur examine la liste des alertes effectivement actives, et si possible un historique des alertes déclenchées dans l'année écoulée. Une supervision sans alerte active depuis 24 mois est, en pratique, non conforme à cette exigence — quel que soit le matériel installé.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">29<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-chap\">Chapitre 6 / 11 — Supervision existante<\u002Fspan><img src=\"18fde7ed-4414-43ca-ba7c-cb7efe5c6b5d\" class=\"head-mark\" alt=\"\"><\u002Fdiv>\n  <h2 style=\"margin-top:0;\">La mise à disposition des données et la maintenance<\u002Fh2>\n\n  <h3>Mise à disposition des données<\u002Fh3>\n  <p>Le décret R175-3 prévoit que les données soient mises à disposition de <strong>deux types d'acteurs distincts<\u002Fstrong> : le gestionnaire du bâtiment (asset manager, property manager, propriétaire) et les exploitants des systèmes techniques (bureau d'études, intégrateur, mainteneur). L'auditeur examine les procédures effectives :<\u002Fp>\n  <ul>\n    <li>Les données sont-elles accessibles au gestionnaire (rapport mensuel, accès portail, export CSV) ?<\u002Fli>\n    <li>Les données sont-elles transmises aux exploitants (procédure documentée, fréquence, format) ?<\u002Fli>\n    <li>Existe-t-il une trace écrite de ces procédures, ou tout repose-t-il sur des habitudes orales ?<\u002Fli>\n  <\u002Ful>\n  <p>Une supervision techniquement excellente peut être non conforme R175-3 si les procédures de mise à disposition n'existent pas formellement.<\u002Fp>\n\n  <h3>R175-4 — Vérifications périodiques<\u002Fh3>\n  <p>L'auditeur examine le <strong>carnet d'entretien<\u002Fstrong> de la supervision — existe-t-il, est-il à jour, qui le remplit ? Trois éléments factuels sont consignés : l'existence de procédures écrites, la périodicité effective des interventions, le responsable identifié (interne ou prestataire). Une supervision sans aucun document de maintenance formalisé n'est pas conforme R175-4, indépendamment de la qualité technique de l'installation.<\u002Fp>\n\n  <h3>R175-5 — Formation de l'exploitant<\u002Fh3>\n  <p>L'auditeur cherche <strong>l'attestation de formation<\u002Fstrong> — quand l'exploitant en place a-t-il été formé à l'utilisation de la supervision, par quel organisme, sur quels sujets ? La formation initiale du livreur de l'installation suffit rarement à dix ans d'écart, après changements d'équipe. C'est l'une des non-conformités les plus fréquentes — et l'une des plus simples à corriger.<\u002Fp>\n\n  <div class=\"page-foot\"><span class=\"chap\">buildy.fr · contact@buildy.fr<\u002Fspan><span class=\"num\">30<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\">\n  <div class=\"page-header\"><span class=\"head-cha
