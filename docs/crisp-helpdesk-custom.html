<!-- ============================================================================
     Hide empty paragraphs (CSS ne peut matcher ni &nbsp; ni textContent)
     Crisp insère <p><br></p> ET <p><span>&nbsp;</span></p> entre chaque bloc
     selon l'origine du contenu (export Word vs Tiptap natif).
     ============================================================================ -->
<script>
(function() {
  function cleanEmptyParagraphs() {
    var paragraphs = document.querySelectorAll('.csh-article article p, .csh-article-content-text p');
    paragraphs.forEach(function(p) {
      // Strip toutes formes d'espaces (regular, non-breaking U+00A0, narrow nbsp U+202F, zero-width)
      var text = (p.textContent || '').replace(/[\s  ​]/g, '');
      if (!text) p.style.display = 'none';
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', cleanEmptyParagraphs);
  } else {
    cleanEmptyParagraphs();
  }
  // Au cas où Crisp re-render dynamiquement (SPA-style), on observe le DOM
  if (typeof MutationObserver !== 'undefined') {
    var debounce;
    new MutationObserver(function() {
      clearTimeout(debounce);
      debounce = setTimeout(cleanEmptyParagraphs, 150);
    }).observe(document.body, { childList: true, subtree: true });
  }
})();
</script>
