<!-- ============================================================================
     JS : nettoyage empty paragraphs (Crisp insère <p><br></p> et <p>&nbsp;</p>)
        + raccourci "/" pour focus search bar
        + injection des compteurs d'articles par catégorie sur la home
     ============================================================================ -->
<script>
(function() {
  // ── Hide empty paragraphs (artefacts Crisp + Word imports) ─────────
  // ATTENTION : ne pas masquer les <p><img></p> (Crisp wrappe les images
  // en paragraphe sans texte) ni les autres médias.
  function cleanEmptyParagraphs() {
    var paragraphs = document.querySelectorAll('.csh-article article p, .csh-article-content-text p');
    paragraphs.forEach(function(p) {
      if (p.querySelector('img, iframe, video, audio, svg, picture, embed, object')) return;
      var text = (p.textContent || '').replace(/[\s  ​]/g, ''); // espaces, U+00A0, U+202F, U+200B
      if (!text) p.style.display = 'none';
    });
  }
  function startObserver() {
    if (typeof MutationObserver === 'undefined' || !document.body) return;
    var debounce;
    new MutationObserver(function() {
      clearTimeout(debounce);
      debounce = setTimeout(function() {
        cleanEmptyParagraphs();
        injectArticleExcerpt();
      }, 150);
    }).observe(document.body, { childList: true, subtree: true });
  }

  // ── Raccourci clavier "/" pour focus la search bar (style GitHub / Linear) ──
  function bindSearchShortcut() {
    document.addEventListener('keydown', function(e) {
      if (e.key !== '/') return;
      var t = e.target;
      var tag = (t.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || t.isContentEditable) return;
      var search = document.querySelector('.csh-header-search input[type="search"]');
      if (search) {
        e.preventDefault();
        search.focus();
      }
    });
  }

  // ── Description sous le H1 d'article (meta description SEO) ─────
  function injectArticleExcerpt() {
    var header = document.querySelector('.csh-article .csh-article-content-header');
    if (!header || header.dataset.excerptInjected) return;
    var h1 = header.querySelector('h1');
    if (!h1) return;
    var meta = document.querySelector('meta[name="description"]');
    var text = meta ? (meta.getAttribute('content') || '').trim() : '';
    if (!text) return;
    header.dataset.excerptInjected = '1';
    var p = document.createElement('p');
    p.className = 'buildy-article-excerpt';
    p.textContent = text;
    h1.insertAdjacentElement('afterend', p);
  }

  // ── Compteur d'articles par catégorie sur la home ────────────────
  function injectCategoryCounts() {
    var cards = document.querySelectorAll('.csh-home-list.csh-home-list-large li a, .csh-home-list-large li a.csh-box-link');
    if (!cards.length) return;
    cards.forEach(function(card) {
      if (card.dataset.countInjected) return;
      card.dataset.countInjected = '1';
      var href = card.getAttribute('href');
      if (!href || !/\/category\//.test(href)) return;
      fetch(href, { credentials: 'same-origin' })
        .then(function(r) { return r.text(); })
        .then(function(html) {
          var doc = new DOMParser().parseFromString(html, 'text/html');
          var items = doc.querySelectorAll('li.csh-category-item');
          var count = items.length;
          var label = count === 0 ? 'Aucun article'
                    : count === 1 ? '1 article'
                    : count + ' articles';
          var aside = card.querySelector('[class*="csh-home-list-aside"]');
          if (!aside) return;
          var badge = document.createElement('span');
          badge.className = 'buildy-cat-count';
          badge.textContent = label;
          aside.appendChild(badge);
        })
        .catch(function() { /* silently fail */ });
    });
  }

  function init() {
    cleanEmptyParagraphs();
    startObserver();
    bindSearchShortcut();
    injectCategoryCounts();
    injectArticleExcerpt();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
